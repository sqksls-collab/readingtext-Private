<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송지희 국어</title>

<style>
:root{--bg:#f7f5f0;--card:#fff;--text:#1b2230;--muted:#6b7385;--line:#e4e7ee;--primary:#2f5d50;--primary-weak:#e8f1ed;
--ok:#0f9d58;--ok-weak:#e6f6ed;--warn:#c77c00;--warn-weak:#fff4dc;--bad:#d93f45;--bad-weak:#fdeceb;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
h2{font-size:17px;margin:0 0 12px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
input[type=checkbox],input[type=radio]{width:auto;box-shadow:none}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
label>input,label>select,label>textarea{margin-top:5px;font-weight:400;color:var(--text);font-size:15px}
label.inline{display:inline-flex;align-items:center;gap:6px;margin-right:16px;color:var(--text);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:#f3f4f8}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:default}
.w100{width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;font-weight:600;font-size:12px}
.layout{display:flex;min-height:100vh}
.side{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 10px 20px}.brand img{height:40px;display:block}.brand small{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--muted);background:#f1efe9;padding:1px 8px;border-radius:99px}
.auth-logo{display:block;width:190px;max-width:70%;margin:0 auto 6px}
.ver{display:block;text-align:center;font-size:11px;color:var(--muted);margin-bottom:18px}
.install{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.install img{width:42px;height:42px;border-radius:10px}
.install div{flex:1;font-size:14px}
.steps{margin:8px 0 0;padding-left:20px}.steps li{margin-bottom:8px}
.usage .bar{height:10px}.usage .bar i.warn{background:var(--warn)}.usage .bar i.bad{background:var(--bad)}
.nav a{display:block;padding:10px 12px;border-radius:9px;color:var(--text);font-weight:500;margin-bottom:2px}
.nav a:hover{background:#f3f4f8}
.nav a.on{background:var(--primary-weak);color:var(--primary);font-weight:700}
.nav .mobile-only{display:none}
.me{margin-top:auto;padding:12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.me b{color:var(--text)}
.main{flex:1;min-width:0;padding:30px 34px;max-width:1240px}
.page{font-size:23px;margin:0 0 18px;letter-spacing:-.4px}
.back{display:inline-block;margin-bottom:10px;font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.grid{display:grid;gap:12px;margin-bottom:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stats .card{margin:0}
.stat .n{font-size:27px;font-weight:800;letter-spacing:-.5px}
.stat .l{color:var(--muted);font-size:13px;margin-bottom:6px}
.flex{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.right{text-align:right;margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.pre{white-space:pre-wrap;margin:0}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef0f4;color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-weak);color:var(--ok)}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.bad{background:var(--bad-weak);color:var(--bad)}
.badge.blue{background:var(--primary-weak);color:var(--primary)}
.row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--text)}
.row:last-child{border-bottom:0}
a.row:hover{background:#fafbfd}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--muted)}
.bar{height:6px;background:#edf0f4;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .4s}
.bar.big{height:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:var(--text);display:block}
.vcard:hover{box-shadow:0 4px 16px rgba(20,30,60,.08)}
.thumb{aspect-ratio:16/9;background:#1b2230 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;position:relative}
.thumb .done{position:absolute;top:8px;right:8px}
.vcard .body{padding:12px 14px}
.player-wrap{position:relative;padding-top:56.25%;background:#000;border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.player-wrap iframe,.player-wrap video,.player-wrap #player{position:absolute;inset:0;width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;background:#fafbfd}
td select{padding:5px 8px;font-size:13px;width:auto}
.tbl-wrap{overflow-x:auto}
.mx-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.mx th,.mx td{text-align:center;white-space:nowrap;padding:8px 10px;border-right:1px solid var(--line)}
.mx thead th{position:sticky;top:0;z-index:2}
.mx .sticky{position:sticky;left:0;background:#fff;text-align:left;z-index:1;min-width:110px}
.mx thead .sticky{z-index:3;background:#fafbfd}
.cell{display:inline-block;min-width:44px;padding:2px 6px;border-radius:6px;font-size:12px;font-weight:700}
.cell.ok{background:var(--ok-weak);color:var(--ok)}
.cell.warn{background:var(--warn-weak);color:var(--warn)}
.cell.bad{background:var(--bad-weak);color:var(--bad)}
.na{color:#c8ccd6}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;letter-spacing:2px;background:#f3f4f8;padding:3px 10px;border-radius:7px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:400px;padding:30px}
.auth-card h1{margin:0 0 4px;font-size:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:85vh;overflow:auto}
.people{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:6px 12px;margin-bottom:12px}
.people div{padding:6px 0;border-bottom:1px solid var(--line)}
.people div:last-child{border-bottom:0}
.bulk{background:var(--primary-weak);padding:10px 14px;border-radius:10px;margin-bottom:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:#1b2230;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
#toast div.err{background:var(--bad)}
details summary{cursor:pointer;color:var(--primary);font-size:13px}
.upl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:8px}
.upl-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eef0f4;border:1px solid var(--line)}
.upl-item img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.upl-file{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;cursor:pointer;padding:6px;text-align:center}
.upl-file span{font-size:11px;color:var(--muted);word-break:break-all;line-height:1.3}
.upl-item .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:17px;line-height:1;cursor:pointer}
.upl-item .new{position:absolute;left:4px;bottom:4px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 6px}
.pick-row .btn{padding:14px 10px;font-size:15px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumb-s{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#eef0f4;border:1px solid var(--line);cursor:zoom-in}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 4px}
.stepper button{width:52px;height:52px;border-radius:50%;font-size:26px;font-weight:700;padding:0}
.stepper input{width:96px;text-align:center;font-size:30px;font-weight:800;padding:6px}
.scoreline{text-align:center;font-size:15px;margin-bottom:14px}
.pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.hist{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.hist div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--muted);min-width:0}
.hist i{display:block;width:100%;background:var(--primary);border-radius:6px 6px 0 0;min-height:2px}
.hist b{font-size:11px;color:var(--text);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1efe9;border-radius:10px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:9px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;justify-content:flex-end;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.rp-logo{height:28px;display:block}
.report{position:relative}
.rp-water{position:absolute;right:-10px;top:-6px;width:150px;opacity:.06;pointer-events:none}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hello img{width:46px;height:46px;object-fit:contain;flex-shrink:0}
.loading img{display:block;width:64px;margin:0 auto 12px;opacity:.55;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.2;transform:scale(.96)}}
.empty img{display:block;width:34px;margin:0 auto 8px;opacity:.22}
.m-logo{display:none}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.pushbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.pushbar div{flex:1;font-size:14px}
.kid{display:block;color:var(--text)}
@media print{
 .side,.no-print,.install,.pushbar,#toast,.back{display:none!important}
 .layout{display:block}.main{padding:0;max-width:none}body{background:#fff}
 .card{break-inside:avoid;border-color:#ddd}.stats .card{border-color:#ddd}
}
.lb img{max-width:100%;max-height:72vh;display:block;margin:12px auto 0;border-radius:8px;background:#f3f4f8}
@media(max-width:780px){
 .layout{flex-direction:column}
 .side{width:auto;height:auto;position:sticky;top:0;z-index:10;flex-direction:row;align-items:center;padding:8px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
 .brand,.me{display:none}
 .m-logo{display:block;width:30px;height:30px;object-fit:contain;margin:0 4px 0 6px;flex-shrink:0}
 .nav{display:flex;gap:2px}.nav a{white-space:nowrap;margin:0}.nav .mobile-only{display:block;color:var(--muted)}
 .main{padding:18px 14px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .stat .n{font-size:23px}
 .form-grid{grid-template-columns:1fr}
}
</style>
</head>

<script>
/* =====================================================================
   ★ 설정: Supabase 대시보드 > Project Settings > API (또는 Connect 버튼)
   에서 Project URL 과 Publishable key(= anon key)를 복사해 넣으세요.
   ===================================================================== */
const SUPABASE_URL = 'https://oijqmkpguethqbegkgci.supabase.co';
const SUPABASE_KEY = 'sb_publishable__B3Orlvtfod5KE0Y-5WRvg_mfUSBz1-';
const SITE_NAME    = '송지희 국어';
const VERSION_TAG  = '';
const FREE_STORAGE_MB = 1024;   // Supabase 무료 요금제 파일 저장 공간

const BUCKET_SEC   = 5;    // 시청 구간 단위(초)
const COMPLETE_PCT = 90;   // 이 % 이상 보면 '완료'
const SAVE_EVERY   = 10;   // 몇 초마다 진도 저장

/* ---------------- 공통 도구 ---------------- */
const $app = document.getElementById('app');
const state = { session: null, profile: null, classes: [] };
let sb = null, cleanup = null, routeSeq = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc = (s, n) => (s = String(s ?? '')).length > n ? s.slice(0, n) + '…' : s;
const uid = () => state.profile.id;
const className = id => state.classes.find(c => c.id === id)?.name || '';
const key = (a, b) => a + '|' + b;
const isStaff = () => ['teacher', 'assistant'].includes(state.profile?.role);
const isHead = () => state.profile?.role === 'teacher';

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = type; el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 5000 : 2500);
}
async function q(promise) {
  const { data, error } = await promise;
  if (error) { toast(error.message, 'err'); throw error; }
  return data;
}
async function fetchAll(table, select = '*', apply) {
  let all = [], from = 0; const size = 1000;
  for (;;) {
    let b = sb.from(table).select(select);
    if (apply) b = apply(b);
    const { data, error } = await b.order('id').range(from, from + size - 1);
    if (error) { toast(error.message, 'err'); throw error; }
    all = all.concat(data);
    if (data.length < size) return all;
    from += size;
  }
}
function fmtDate(d, withTime = true) {
  if (!d) return '-';
  return new Date(d).toLocaleString('ko-KR', withTime
    ? { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' }
    : { year: 'numeric', month: 'numeric', day: 'numeric' });
}
function fmtDur(sec) {
  sec = Math.round(sec || 0);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}시간 ${m}분` : m ? `${m}분 ${s}초` : `${s}초`;
}
function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
function dday(due) {
  if (!due) return '마감 없음';
  const ms = new Date(due) - Date.now();
  if (ms < 0) return '마감 지남';
  if (ms < 86400000) return `${Math.max(1, Math.ceil(ms / 3600000))}시간 남음`;
  return `D-${Math.ceil(ms / 86400000)}`;
}
const pctClass = p => p >= COMPLETE_PCT ? 'ok' : p > 0 ? 'warn' : 'bad';
const pctStr = (a, b) => b ? Math.round(a / b * 100) + '%' : '-';
const badge = (t, c = '') => `<span class="badge ${c}">${t}</span>`;
const stat = (n, l, extra = '') => `<div class="card stat"><div class="l">${l}</div><div class="n">${n}</div>${extra}</div>`;
const empty = t => `<div class="empty"><img src="icons/emblem.png" alt="" aria-hidden="true">${t}</div>`;
const isLate = (a, s) => !!(a.due_at && s && new Date(s.submitted_at) > new Date(a.due_at));
const isTarget = (item, s) => !item.class_id || item.class_id === s.class_id;

function subBadge(a, s) {
  if (s?.graded_at) return badge(`${s.score ?? '-'}점`, 'blue');
  if (s) return isLate(a, s) ? badge('지각 제출', 'warn') : badge('제출 완료', 'ok');
  if (a.due_at && new Date(a.due_at) < Date.now()) return badge('미제출', 'bad');
  return badge('미제출');
}
function classOptions(selected, allLabel) {
  return (allLabel !== undefined ? `<option value="">${allLabel}</option>` : '') +
    state.classes.map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
}
function ytId(u) {
  u = (u || '').trim();
  if (/^[\w-]{11}$/.test(u)) return u;
  const m = u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function fileExt(name) { const m = /\.([a-z0-9]{1,8})$/i.exec(name || ''); return m ? m[1].toLowerCase() : 'bin'; }
async function openFile(bucket, path) {
  const w = window.open('', '_blank');
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (error) { w?.close(); return toast('파일을 열 수 없어요: ' + error.message, 'err'); }
  if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
}
function copy(text) {
  if (!text) return toast('복사할 내용이 없어요');
  navigator.clipboard.writeText(text).then(() => toast('복사했어요'), () => toast('복사에 실패했어요', 'err'));
}
function downloadCSV(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function modal(html) {
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); });
  document.body.appendChild(m);
  return m;
}
function subFiles(x) {
  if (!x) return [];
  if (Array.isArray(x.files) && x.files.length) return x.files;
  return x.file_path ? [{ path: x.file_path, name: x.file_name || '파일', type: '' }] : [];
}
const isImg = f => (f.type || '').startsWith('image/') || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name || f.path || '');
async function signUrls(bucket, paths) {
  const out = {};
  for (let i = 0; i < paths.length; i += 100) {
    const { data } = await sb.storage.from(bucket).createSignedUrls(paths.slice(i, i + 100), 3600);
    (data || []).forEach(d => { if (d.signedUrl) out[d.path] = d.signedUrl; });
  }
  return out;
}
// 폰 사진(5~10MB)을 글씨는 잘 보이게 두고 1MB 안팎으로 줄임
async function shrinkImage(file, max = 1600, quality = 0.72) {
  if (!(file.type || '').startsWith('image/') || /gif/i.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 4e5) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}
async function removeFiles(bucket, paths) {
  paths = paths.filter(Boolean);
  for (let i = 0; i < paths.length; i += 100) await sb.storage.from(bucket).remove(paths.slice(i, i + 100));
}

      await removeFiles('submissions', paths);

    return;
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (/KAKAOTALK/i.test(UA) && !sessionStorage.getItem('extTried')) { sessionStorage.setItem('extTried', '1'); openExternal(); }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  sb.auth.onAuthStateChange((evt, session) => {
    const prev = state.session?.user?.id;
    state.session = session;
    if (evt === 'PASSWORD_RECOVERY') return setTimeout(renderNewPassword, 0);
    if (session?.user?.id !== prev) { state.profile = null; setTimeout(route, 0); }
  });
  window.addEventListener('hashchange', route);
  route();
}

async function route() {
  const seq = ++routeSeq;
  if (cleanup) { const c = cleanup; cleanup = null; try { await c(); } catch (e) { console.error(e); } }
  if (seq !== routeSeq) return;
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  try {
    if (!state.session) return parts[0] === 'signup' ? renderSignup() : renderLogin();
    if (!state.profile) {
      const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
      if (error) throw error;
      state.profile = data;
    }
    if (!state.profile) return renderMessage('프로필을 찾을 수 없어요', '데이터베이스 설정(schema.sql)이 끝났는지 확인해 주세요.');
    if (state.profile.status !== 'approved') return renderPending();
    state.classes = await fetchAll('classes', '*', b => b.order('name'));
    if (seq !== routeSeq) return;
    if (isStaff()) await teacherRoute(parts);
    else if (state.profile.role === 'parent') await parentRoute(parts);
    else await studentRoute(parts);
  } catch (e) {
    console.error(e);
    const main = document.getElementById('main');
    const msg = `<div class="card"><h2>문제가 생겼어요</h2><p class="muted">${esc(e.message || e)}</p>
      <button class="btn" onclick="route()">다시 시도</button></div>`;
    if (main) main.innerHTML = msg; else $app.innerHTML = `<div class="auth">${msg}</div>`;
  }
}

      <label id="childBox" style="display:none">자녀 연결 코드 <span class="muted">(자녀 앱의 '내 성적' 화면에 있어요. 형제는 띄어쓰기로 여러 개)</span><input name="child_codes" placeholder="예: ZUR5R8" style="text-transform:uppercase"></label>
      <label><span id="phoneLabel">전화번호 <span class="muted">(선택)</span></span><input name="phone" type="tel" placeholder="010-0000-0000"></label>
      <label>이메일<input name="email" type="email" required autocomplete="email"></label>

      <button class="btn primary w100">가입하기</button></form>
    <p class="center muted small" style="margin-top:18px">이미 계정이 있나요? <a href="#/">로그인</a></p></div></div>`;
  const f = document.getElementById('f');
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    role = b.dataset.role;
    document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    const parent = role === 'parent';
    document.getElementById('classBox').style.display = parent ? 'none' : '';
    document.getElementById('childBox').style.display = parent ? '' : 'none';
    document.getElementById('nameLabel').textContent = parent ? '학부모 이름 (예: 김민준 어머니)' : '이름';
    document.getElementById('phoneLabel').innerHTML = parent ? '전화번호 <span class="muted">(알림·연락용)</span>' : '전화번호 <span class="muted">(선택)</span>';
    f.phone.required = parent;
  });
  f.onsubmit = async e => {
    e.preventDefault(); const btn = f.querySelector('button.primary');
    busy(btn, true);
    try {
      const meta = { full_name: f.full_name.value.trim(), phone: f.phone.value.trim() };
      if (role === 'parent') {
        const codes = [...new Set(f.child_codes.value.toUpperCase().split(/[\s,]+/).filter(Boolean))];
        if (!codes.length) { toast('자녀 연결 코드를 넣어 주세요', 'err'); return; }
        const names = [];
        for (const code of codes) {
          const { data, error } = await sb.rpc('check_link_code', { code });
          if (error) throw error;
          if (!data) { toast(`'${code}'는 맞지 않는 코드예요. 자녀 앱에서 다시 확인해 주세요.`, 'err'); return; }
          names.push(data);
        }
        if (!confirm(`자녀: ${names.join(', ')}\n맞으면 확인을 눌러 주세요.`)) return;
        Object.assign(meta, { role: 'parent', child_codes: codes });
      } else {
        const code = f.class_code.value.trim().toUpperCase();
        if (code) {
          const { data: cname, error } = await sb.rpc('check_class_code', { code });
          if (error) throw error;
          if (!cname) { toast('반 코드가 맞지 않아요. 선생님께 다시 확인해 주세요.', 'err'); return; }
          if (!confirm(`'${cname}' 반으로 가입할까요?`)) return;
        }
        meta.class_code = code;
      }
      const { data, error } = await sb.auth.signUp({ email: f.email.value.trim(), password: f.password.value,
        options: { data: meta, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) renderMessage('이메일을 확인해 주세요 📮', `${esc(f.email.value)} 로 보낸 인증 메일의 링크를 누르면 가입이 완료돼요.`, true);
    } catch (err) {
      toast(/registered|exists/i.test(err.message) ? '이미 가입된 이메일이에요' : err.message, 'err');
    } finally { busy(btn, false); }
  };
}

/* =====================================================================
   영상 시청 추적기 – 실제로 재생된 5초 구간만 '본 것'으로 기록
   ===================================================================== */
class Tracker {
  constructor(video, prog) {
    this.v = video;
    this.buckets = new Set(prog?.watched || []);
    this.maxPos = prog?.max_position || 0;
    this.total = prog?.total_watch_seconds || 0;
    this.completed = !!prog?.completed;
    this.duration = prog?.duration_seconds || 0;
    this.lastT = null; this.dirty = false; this.saving = false; this.lastSave = Date.now();
    this.timer = setInterval(() => this.tick(), 1000);
    this.onHide = () => { if (document.visibilityState === 'hidden') this.save(); };
    this.onUnload = () => this.save();
    document.addEventListener('visibilitychange', this.onHide);
    window.addEventListener('pagehide', this.onUnload);
    this.render();
  }
  attach(o) { Object.assign(this, o); }
  percent() {
    if (!this.duration) return 0;
    const n = Math.max(1, Math.ceil(this.duration / BUCKET_SEC));
    return Math.min(100, Math.round(this.buckets.size / n * 100));
  }
  tick() {
    if (!this.getTime) return;
    const d = this.getDuration(); if (d > 0) this.duration = d;
    const t = this.getTime();
    if (!this.isPlaying()) { this.lastT = t; return; }
    if (this.v.no_skip && !this.completed && t > this.maxPos + 3) {
      this.seek(this.maxPos); this.lastT = this.maxPos;
      toast('아직 안 본 부분으로는 건너뛸 수 없어요'); return;
    }
    if (this.lastT != null && t >= this.lastT && t - this.lastT <= 3) {   // 정상 재생 구간
      for (let b = Math.floor(this.lastT / BUCKET_SEC); b <= Math.floor(t / BUCKET_SEC); b++) this.buckets.add(b);
      this.total += 1;
      if (t > this.maxPos) this.maxPos = t;
      this.dirty = true;
    }
    this.lastT = t;
    this.render();
    if (this.dirty && Date.now() - this.lastSave > SAVE_EVERY * 1000) this.save();
  }
  onEnded() {
    if (this.lastT != null && this.duration && this.duration - this.lastT < 4) {
      this.buckets.add(Math.floor((this.duration - 0.01) / BUCKET_SEC));
      this.maxPos = this.duration;
    }
    this.dirty = true; this.render(); this.save();
  }
  render() {
    const p = this.percent();
    const pe = document.getElementById('pct'), pb = document.getElementById('pbar'), pi = document.getElementById('pinfo');
    if (pe) pe.innerHTML = (this.completed || p >= COMPLETE_PCT) ? badge('시청 완료 ✓', 'ok') : `<b>${p}%</b>`;
    if (pb) pb.style.width = p + '%';
    if (pi) pi.textContent = `총 시청 시간 ${fmtDur(this.total)} · ${COMPLETE_PCT}% 이상 보면 완료로 표시돼요`;
  }
  async save() {
    if (!this.dirty || this.saving) return;
    this.saving = true; this.dirty = false; this.lastSave = Date.now();
    const pct = this.percent();
    if (pct >= COMPLETE_PCT) this.completed = true;
    const { error } = await sb.from('video_progress').upsert({
      user_id: uid(), video_id: this.v.id,
      watched: [...this.buckets].sort((a, b) => a - b),
      max_position: Math.floor(this.maxPos), percent: pct, completed: this.completed,
      total_watch_seconds: this.total, duration_seconds: Math.round(this.duration) || null,
      last_watched_at: new Date().toISOString()
    }, { onConflict: 'user_id,video_id' });
    this.saving = false;
    if (error) { this.dirty = true; console.error(error); }
  }
  async stop() {
    clearInterval(this.timer);
    document.removeEventListener('visibilitychange', this.onHide);
    window.removeEventListener('pagehide', this.onUnload);
    await this.save();
    try { this.destroy?.(); } catch (e) {}
  }
}

let ytReady = null;
function loadYT() {
  if (window.YT?.Player) return Promise.resolve();
  if (!ytReady) ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytReady;
}
async function mountPlayer(v, tracker) {
  const resumeAt = tracker && !tracker.completed && tracker.maxPos > 5 ? Math.floor(tracker.maxPos) : 0;
  if (v.source === 'youtube') {
    await loadYT();
    if (!document.getElementById('player')) return;
    const player = new YT.Player('player', {
      videoId: v.youtube_id,
      playerVars: { rel: 0, playsinline: 1, modestbranding: 1, start: resumeAt },
      events: {
        onReady: () => tracker?.attach({
          getTime: () => player.getCurrentTime?.() || 0,
          isPlaying: () => player.getPlayerState?.() === YT.PlayerState.PLAYING,
          seek: t => player.seekTo(t, true),
          getDuration: () => player.getDuration?.() || 0,
          destroy: () => player.destroy()
        }),
        onStateChange: e => {
          if (!tracker) return;
          if (e.data === YT.PlayerState.ENDED) tracker.onEnded();
          else if (e.data === YT.PlayerState.PAUSED) tracker.save();
        }
      }
    });
    if (!tracker) cleanup = () => { try { player.destroy(); } catch (e) {} };
  } else {
    const { data, error } = await sb.storage.from('videos').createSignedUrl(v.file_path, 60 * 60 * 6);
    if (error) return toast('영상을 불러오지 못했어요: ' + error.message, 'err');
    const holder = document.getElementById('player');
    if (!holder) return;
    holder.outerHTML = `<video id="player" controls playsinline controlslist="nodownload" preload="metadata"></video>`;
    const video = document.getElementById('player');
    video.src = data.signedUrl;
    video.oncontextmenu = e => e.preventDefault();
    if (tracker) {
      if (resumeAt) video.addEventListener('loadedmetadata', () => { video.currentTime = resumeAt; }, { once: true });
      tracker.attach({
        getTime: () => video.currentTime,
        isPlaying: () => !video.paused && !video.ended,
        seek: t => { video.currentTime = t; },
        getDuration: () => isFinite(video.duration) ? video.duration : 0,
        destroy: () => { video.pause(); video.removeAttribute('src'); video.load(); }
      });
      video.addEventListener('pause', () => tracker.save());
      video.addEventListener('ended', () => tracker.onEnded());
    }
  }
}

async function loadStudentData() {
  const [videos, progress, assignments, subs, vtests, vres] = await Promise.all([
    fetchAll('videos', '*', b => b.order('created_at')),
    fetchAll('video_progress', 'id,video_id,percent,completed,last_watched_at', b => b.eq('user_id', uid())),
    fetchAll('assignments', '*', b => b.order('due_at', { ascending: true, nullsFirst: false })),
    fetchAll('submissions', '*', b => b.eq('user_id', uid())),
    fetchAll('vocab_tests', '*', b => b.lte('open_at', new Date().toISOString()).order('open_at', { ascending: false })),
    fetchAll('vocab_results', '*', b => b.eq('user_id', uid()))
  ]);
  return {
    videos, assignments, vtests,
    vm: Object.fromEntries(vres.map(r => [r.test_id, r])),
    pm: Object.fromEntries(progress.map(r => [r.video_id, r])),
    sm: Object.fromEntries(subs.map(r => [r.assignment_id, r]))
  };
}

        ${sub.feedback ? `<p class="pre" style="margin-top:10px">${esc(sub.feedback)}</p>` : ''}</div>` : ''}
    <div class="card"><h2>${locked ? '내가 제출한 내용' : sub ? '제출한 숙제 (마감 전까지 수정 가능)' : '숙제 제출하기'}</h2>
      ${dueLock && !sub.graded_at ? '<p class="small" style="color:var(--bad);margin-top:0">마감이 지나서 더 이상 고칠 수 없어요.</p>' : ''}
      ${sub ? `<p class="muted small">제출 시간 ${fmtDate(sub.submitted_at)}${isLate(a, sub) ? ' · 지각' : ''}${sub.edit_count ? ` · 수정 ${sub.edit_count}회 (수정 기록은 선생님께 보여요)` : ''}</p>` : ''}
      <form id="f">
        <label>내용 <span class="muted">(선택)</span><textarea name="content" ${locked ? 'disabled' : ''} placeholder="답안이나 하고 싶은 말을 적어 주세요" style="min-height:80px">${esc(sub?.content || '')}</textarea></label>
        ${a.photos_needed ? '<p class="small" id="pcount" style="margin:0 0 8px"></p>' : ''}<div id="files"></div>
        ${locked ? '' : `
          <div class="pick-row"><button type="button" class="btn" id="cam">📷 사진 찍기</button>
            <button type="button" class="btn" id="pick">🖼️ 사진·파일 고르기</button></div>
          <p class="muted small" style="margin:0 0 14px">여러 장 올릴 수 있어요. 숙제가 여러 쪽이면 한 쪽씩 찍어 주세요.</p>
          <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
          <input type="file" id="pickIn" accept="image/*,.pdf,.hwp,.hwpx,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip" multiple hidden>
          <button class="btn primary w100" id="go" style="padding:14px">${sub ? '다시 제출하기' : '제출하기'}</button>`}
      </form></div>`;
  document.getElementById('att')?.addEventListener('click', () => openFile('materials', a.file_path));
  const urls = await signUrls('submissions', existing.map(f => f.path));
  const items = () => [
    ...keep.map((f, i) => ({ kind: 'old', i, f, name: f.name, img: isImg(f), url: urls[f.path] })),
    ...added.map((x, i) => ({ kind: 'new', i, f: x.file, name: x.file.name, img: isImg(x.file), url: x.url }))
  ];
  const drawFiles = () => {
    const list = items();
    const cntEl = document.getElementById('pcount');
    if (cntEl && a.photos_needed) { const n = list.length, ok = n >= a.photos_needed;
      cntEl.innerHTML = `<b style="color:var(${ok ? '--ok' : '--bad'})">사진 ${n} / ${a.photos_needed}장</b>${ok ? ' 👍' : locked ? ` · ${a.photos_needed - n}장 덜 냈어요` : ` · ${a.photos_needed - n}장 더 올려 주세요`}`; }
    document.getElementById('files').innerHTML = !list.length && sub?.files_cleared_at ? '<p class="muted small">🧹 채점이 끝나서 사진은 정리됐어요.</p>' : list.length ? `<div class="upl-grid">${list.map(it => `<div class="upl-item">
      ${it.img && it.url ? `<img src="${it.url}" data-view="${it.kind}:${it.i}" alt="">` : `<div class="upl-file" data-view="${it.kind}:${it.i}">📄<span>${esc(trunc(it.name, 16))}</span></div>`}
      ${locked ? '' : `<button type="button" class="x" data-rm="${it.kind}:${it.i}" aria-label="빼기">×</button>`}
      ${it.kind === 'new' ? '<span class="new">새 파일</span>' : ''}</div>`).join('')}</div>` : '';
  };
  drawFiles();
  const f = document.getElementById('f');
  f.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      const [k, i] = rm.dataset.rm.split(':');
      if (k === 'old') keep.splice(+i, 1); else { const x = added.splice(+i, 1)[0]; if (x?.url) URL.revokeObjectURL(x.url); }
      return drawFiles();
    }
    const v = e.target.closest('[data-view]'); if (!v) return;
    const list = items(), [k, i] = v.dataset.view.split(':'), it = list.find(x => x.kind === k && x.i === +i);
    if (it.img && it.url) { const imgs = list.filter(x => x.img && x.url); lightbox(imgs.map(x => ({ url: x.url, name: x.name })), imgs.indexOf(it)); }
    else if (k === 'old') openFile('submissions', it.f.path);
  });
  if (locked) return;
  const addFiles = list => {
    for (const file of list) {
      if (keep.length + added.length >= 20) { toast('파일은 20개까지 올릴 수 있어요', 'err'); break; }
      added.push({ file, url: isImg(file) ? URL.createObjectURL(file) : null });
    }
    drawFiles();
  };
  const camIn = document.getElementById('camIn'), pickIn = document.getElementById('pickIn');
  document.getElementById('cam').onclick = () => camIn.click();
  document.getElementById('pick').onclick = () => pickIn.click();
  camIn.onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  pickIn.onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  f.onsubmit = async e => {
    e.preventDefault();
    const content = f.content.value.trim();
    if (!content && !keep.length && !added.length) return toast('내용을 쓰거나 사진·파일을 올려 주세요', 'err');
    const nPhotos = keep.length + added.length;
    if (a.photos_needed && nPhotos < a.photos_needed && !confirm(`사진이 ${a.photos_needed}장 필요한데 ${nPhotos}장이에요.\n이대로 낼까요? (덜 낸 건 선생님께 보여요)`)) return;
    const btn = document.getElementById('go'); busy(btn, true, '준비 중…');
    try {
      const uploaded = [];
      for (let k = 0; k < added.length; k++) {
        btn.textContent = `올리는 중… (${k + 1}/${added.length})`;
        const orig = added[k].file, file = await shrinkImage(orig);
        const path = `${uid()}/${a.id}/${Date.now()}_${k}.${fileExt(file.name)}`;
        await q(sb.storage.from('submissions').upload(path, file, { contentType: file.type || undefined }));
        uploaded.push({ path, name: orig.name, type: file.type || '', size: file.size });
      }
      btn.textContent = '제출 중…';
      await q(sb.from('submissions').upsert({ assignment_id: a.id, user_id: uid(), content, files: [...keep, ...uploaded],
        file_path: null, file_name: null }, { onConflict: 'assignment_id,user_id' }));
      added.forEach(x => x.url && URL.revokeObjectURL(x.url));
      toast('제출했어요! 👍'); route();
    } catch (err) { busy(btn, false); }
  };
}

/* =====================================================================
   테스트 (어휘 · 동형 모고 · 복습 테스트 … 매주 종류를 골라서)
   ===================================================================== */
const PRESET_CATS = ['어휘', '동형 모고', '복습 테스트'];
const tRaw = (t, r) => r ? (r.score != null ? +r.score : (r.wrong != null ? t.total - r.wrong : null)) : null;
const vocabScore = (t, r) => { const v = tRaw(t, r); return v == null ? null : Math.round(v / t.total * 100); };
const pctCls = p => p >= 90 ? 'ok' : p >= 70 ? 'warn' : 'bad';
function scoreText(t, r) {
  const v = tRaw(t, r); if (v == null) return '';
  return t.grading === 'self' ? `${v}/${t.total}` : `${+v}${t.total !== 100 ? '/' + t.total : ''}점${r.grade ? ` · ${r.grade}등급` : ''}`;
}
function vocabBadge(t, r) {
  if (r && tRaw(t, r) != null) return badge(scoreText(t, r), pctCls(vocabScore(t, r)));
  if (t.grading === 'staff') return badge('채점 전');
  if (t.due_at && new Date(t.due_at) < Date.now()) return badge('미제출', 'bad');
  return badge('미제출');
}
const catBadge = t => `<span class="badge blue" style="margin-right:6px">${esc(t.category || '테스트')}</span>`;
function vocabRow(t, r, href) {
  return `<a class="row" href="${href || '#/vocab/' + t.id}"><div class="row-main"><div class="row-title">${catBadge(t)}${esc(t.title)}</div>
    <div class="row-sub">${t.grading === 'self' ? `${t.total}문항 · 스스로 채점` : `${t.total}점 만점 · 선생님 채점`} · ${t.due_at ? `마감 ${fmtDate(t.due_at)} · ${dday(t.due_at)}` : '마감 없음'}</div></div>${vocabBadge(t, r)}</a>`;
}
function cellVo(d, s, t) {
  if (!isTarget(t, s)) return '<span class="na">·</span>';
  const r = d.voc[key(s.id, t.id)];
  if (!r || tRaw(t, r) == null) return `<span class="cell ${t.grading === 'self' && t.due_at && new Date(t.due_at) < Date.now() ? 'bad' : ''}">${t.grading === 'staff' ? '-' : '✗'}</span>`;
  return `<span class="cell ${pctCls(vocabScore(t, r))}" title="${r.edit_count ? '수정 ' + r.edit_count + '회' : ''}">${esc(t.grading === 'self' ? `${tRaw(t, r)}/${t.total}` : `${+tRaw(t, r)}${r.grade ? ` (${r.grade})` : ''}`)}${r.edited_after_due ? ' ⚠️' : ''}</span>`;
}
function weekTitle(cat = '어휘', date = new Date()) {
  const first = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
  return `${date.getMonth() + 1}월 ${Math.ceil((date.getDate() + first) / 7)}주차 ${cat}`;
}
const canEmbedPdf = () => matchMedia('(pointer:fine)').matches && !/android|iphone|ipad/i.test(UA);
const testTodo = d => d.vtests.filter(t => !d.vm[t.id] && (t.grading === 'self' || Date.now() - new Date(t.open_at) < 7 * 864e5));

      return list.length ? `<div class="card"><h2>${esc(c)}</h2>${list.map(t => vocabRow(t, d.vm[t.id])).join('')}</div>` : ''; }).join('')}

async function sVocab(id) {
  const main = layout('/vocab');

  if (!t) { main.innerHTML = `<div class="card">${empty('테스트를 찾을 수 없어요')}</div>`; return; }

  ]);
  const self = t.grading === 'self', embed = t.pdf_path && canEmbedPdf();
  const dueLock = !!(r && t.lock_after_due && t.due_at && new Date(t.due_at) < Date.now());

      ${r.grade ? stat(r.grade + '등급', '등급') : ''}${r.percentile != null ? stat(r.percentile, '백분위') : ''}</div>
      ${r.memo ? `<p class="small muted" style="margin-bottom:0">메모: ${esc(r.memo)}</p>` : ''}</div>`;

    ${!self || dueLock ? resultCard() + (dueLock ? '<p class="small center" style="color:var(--bad);margin-top:-6px">마감이 지나서 더 이상 고칠 수 없어요.</p>' : '') : ''}
    <div class="card"><p class="muted small" style="margin-top:0">${self ? `${t.total}문항` : `${t.total}점 만점`} · ${t.due_at ? `마감 ${fmtDate(t.due_at)} (${dday(t.due_at)})` : '마감 없음'}</p>
      <div class="pick-row" style="margin:0">
        ${t.pdf_path ? `<button class="btn primary" id="pdf">📄 시험지 열기</button>` : '<span class="muted small">시험지가 아직 없어요</span>'}
        ${vid ? `<a class="btn" href="#/video/${vid.id}">▶ 해설 영상</a>` : ''}</div>
      <p class="muted small" style="margin-bottom:0">${self ? '① 시험지를 풀고 → ② 해설 영상을 보며 채점하고 → ③ 아래에 틀린 개수를 적어 주세요.' : '시험지를 풀어서 학원에 내면, 선생님이 채점해서 점수를 올려 줘요.'}</p>
      ${embed ? '<iframe class="pdf" id="pdfv" style="margin-top:14px" title="시험지"></iframe>' : ''}</div>
    ${!self || dueLock ? '' : `
    <div class="card"><h2>${r ? '내 결과 (마감 전까지 수정 가능)' : '내 결과 입력'}</h2>
      ${r ? `<p class="muted small" style="margin-top:0">저장한 시간 ${fmtDate(r.submitted_at)}${r.edit_count ? ` · 수정 ${r.edit_count}회 (수정 기록은 선생님께 보여요)` : ''}</p>` : ''}
      <form id="f"><p class="center" style="margin:0"><b>총 ${t.total}문항 중 틀린 개수</b></p>
        <div class="stepper"><button type="button" class="btn" id="minus" aria-label="하나 줄이기">−</button>
          <input id="wrong" type="number" inputmode="numeric" min="0" max="${t.total}" value="${r ? r.wrong : ''}" placeholder="0" aria-label="틀린 개수">
          <button type="button" class="btn" id="plus" aria-label="하나 늘리기">＋</button></div>
        <div class="scoreline" id="sl"></div>
        <label>채점한 시험지 사진 ${t.require_photo ? '<span style="color:var(--bad)">(필수)</span>' : '<span class="muted">(선택)</span>'}</label>
        <div id="files"></div>
        <div class="pick-row"><button type="button" class="btn" id="cam">📷 사진 찍기</button><button type="button" class="btn" id="pick">🖼️ 사진 고르기</button></div>
        <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
        <input type="file" id="pickIn" accept="image/*,.pdf" multiple hidden>
        <label style="margin-top:12px">헷갈린 문제나 질문 <span class="muted">(선택)</span><textarea name="memo" style="min-height:60px">${esc(r?.memo || '')}</textarea></label>
        <button class="btn primary w100" id="go" style="padding:14px">${r ? '수정해서 저장' : '저장하기'}</button></form></div>`}`;
  let pdfUrl = null;

  };
  document.getElementById('minus').onclick = () => { wi.value = clamp((+wi.value || 0) - 1); showScore(); };
  document.getElementById('plus').onclick = () => { wi.value = clamp((+wi.value || 0) + 1); showScore(); };
  wi.oninput = showScore; showScore();
  const urls = await signUrls('submissions', keep.map(f => f.path));
  const drawFiles = () => {

      <button type="button" class="x" data-rm="${it.k}:${it.i}" aria-label="빼기">×</button></div>`).join('')}</div>` : '';
  };
  drawFiles();
  const f = document.getElementById('f');
  f.addEventListener('click', e => {

    const v = e.target.closest('[data-view]');

      lightbox(imgs, Math.max(0, imgs.findIndex(x => x.url === v.src))); }

  const camIn = document.getElementById('camIn'), pickIn = document.getElementById('pickIn');
  document.getElementById('cam').onclick = () => camIn.click();
  document.getElementById('pick').onclick = () => pickIn.click();
  camIn.onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  pickIn.onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  f.onsubmit = async e => {
    e.preventDefault();
    if (wi.value === '') return toast('틀린 개수를 넣어 주세요 (다 맞았으면 0)', 'err');
    if (t.require_photo && !keep.length && !added.length) return toast('채점한 시험지 사진을 올려 주세요', 'err');
    const btn = document.getElementById('go'); busy(btn, true, '저장 중…');
    try {
      const uploaded = [];
      for (let k = 0; k < added.length; k++) {
        btn.textContent = `사진 올리는 중… (${k + 1}/${added.length})`;
        const orig = added[k].file, file = await shrinkImage(orig);
        const path = `${uid()}/vocab/${t.id}/${Date.now()}_${k}.${fileExt(file.name)}`;
        await q(sb.storage.from('submissions').upload(path, file, { contentType: file.type || undefined }));
        uploaded.push({ path, name: orig.name, type: file.type || '', size: file.size });
      }
      await q(sb.from('vocab_results').upsert({ test_id: t.id, user_id: uid(), wrong: clamp(+wi.value), files: [...keep, ...uploaded],
        memo: f.memo.value.trim() || null }, { onConflict: 'test_id,user_id' }));
      toast(`저장했어요! ${t.total - clamp(+wi.value)}/${t.total} 👍`); route();
    } catch (err) { busy(btn, false); }
  };
}

function vocabForm(t = {}, videos = [], cats = []) {
  let last = 20; try { last = +localStorage.getItem('vocabTotal') || 20; } catch (e) {}
  const cat = t.category || '어휘', grading = t.grading || 'self';
  const allCats = [...new Set([...PRESET_CATS, ...cats])];

    <label>공개 시작 <span class="muted">(이때부터 학생에게 보여요)</span><input type="datetime-local" name="open_at" value="${toLocalInput(t.open_at || new Date().toISOString())}"></label>
    <label>마감 <span class="muted">(선택)</span><input type="datetime-local" name="due_at" value="${toLocalInput(t.due_at)}"></label>
    <label>해설 영상 <span class="muted">(선택)</span><select name="video_id"><option value="">없음</option>
      ${videos.slice().reverse().map(v => `<option value="${v.id}" ${v.id === t.video_id ? 'selected' : ''}>${esc(v.title)}</option>`).join('')}</select></label>
    <label>시험지 PDF ${t.pdf_name ? `<span class="muted">(현재: ${esc(t.pdf_name)})</span>` : '<span class="muted">(선택)</span>'}<input type="file" name="file" accept=".pdf,image/*"></label>
    <div class="full">
      <label class="inline" data-selfonly><input type="checkbox" name="require_photo" ${t.require_photo ? 'checked' : ''}> 채점한 시험지 사진 필수</label>
      <label class="inline" data-selfonly><input type="checkbox" name="lock_after_due" ${t.lock_after_due !== false ? 'checked' : ''}> 마감 후 수정 막기</label>
      <label class="inline"><input type="checkbox" name="use_grade" ${t.use_grade ? 'checked' : ''}> 등급·백분위도 기록 (모고용)</label></div></div>`;
}
function wireVocabForm(f) {
  const upd = () => { const self = f.grading.value === 'self';
    f.querySelector('[data-totlabel]').textContent = self ? '문항 수' : '만점';
    f.querySelectorAll('[data-selfonly]').forEach(x => x.style.display = self ? '' : 'none'); };
  f.querySelectorAll('[name=grading]').forEach(r => r.addEventListener('change', () => { upd(); if (!f.total.dataset.touched) f.total.value = f.grading.value === 'self' ? 20 : 100; }));
  f.total.addEventListener('input', () => { f.total.dataset.touched = '1'; });
  f.title.addEventListener('input', () => { f.title.dataset.auto = ''; });
  f.category.addEventListener('input', () => {
    const c = f.category.value.trim();
    if (f.title.dataset.auto) f.title.value = weekTitle(c || '테스트');
    if (f.title.dataset.auto !== undefined && /모고|모의/.test(c) && !f.dataset.id) {
      f.querySelector('[name=grading][value=staff]').checked = true; f.use_grade.checked = true; upd();
      if (!f.total.dataset.touched) f.total.value = 100;
    }
  });
  upd();
}
async function saveVocab(f, existing) {
  const row = { title: f.title.value.trim(), category: f.category.value.trim() || '테스트', grading: f.grading.value, class_id: f.class_id.value || null, total: +f.total.value,
    open_at: f.open_at.value ? new Date(f.open_at.value).toISOString() : new Date().toISOString(),
    due_at: f.due_at.value ? new Date(f.due_at.value).toISOString() : null, video_id: f.video_id.value || null,
    require_photo: f.grading.value === 'self' && f.require_photo.checked, lock_after_due: f.lock_after_due.checked, use_grade: f.use_grade.checked };
  if (row.grading === 'self') { try { localStorage.setItem('vocabTotal', row.total); } catch (e) {} }
  const file = f.file.files[0];
  if (file) {
    row.pdf_path = `vocab/${crypto.randomUUID()}.${fileExt(file.name)}`; row.pdf_name = file.name;
    await q(sb.storage.from('materials').upload(row.pdf_path, file, { contentType: file.type || 'application/pdf' }));
    if (existing?.pdf_path) await sb.storage.from('materials').remove([existing.pdf_path]);
  }
  if (existing) await q(sb.from('vocab_tests').update(row).eq('id', existing.id));
  else await q(sb.from('vocab_tests').insert(row));
}
async function removeVocabFiles(testIds) {
  if (!testIds.length) return;
  const rs = await fetchAll('vocab_results', 'id,files,history', b => b.in('test_id', testIds));
  await removeFiles('submissions', rs.flatMap(r => [...(r.files || []), ...(r.history || []).flatMap(h => h.files || [])].map(f => f.path)));
}

async function tVocab(id) {
  const main = layout('/t/vocab');
  const d = await loadTeacherData();
  const t = d.vtests.find(x => x.id === id);
  if (!t) { main.innerHTML = `<div class="card">${empty('테스트를 찾을 수 없어요')}</div>`; return; }
  const cats = [...new Set(d.vtests.map(x => x.category || '테스트'))];
  const rs = await fetchAll('vocab_results', '*', b => b.eq('test_id', id));
  const rm = Object.fromEntries(rs.map(r => [r.user_id, r]));
  const self = t.grading === 'self';
  const rows = d.approved.filter(s => isTarget(t, s)).map(s => ({ s, r: rm[s.id] }))
    .sort((a, b) => self ? ((!!b.r - !!a.r) || ((vocabScore(t, a.r) ?? 0) - (vocabScore(t, b.r) ?? 0))) : a.s.full_name.localeCompare(b.s.full_name, 'ko'));
  const done = rows.filter(x => x.r && tRaw(t, x.r) != null), scores = done.map(x => vocabScore(t, x.r));
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  const buckets = self
    ? Array.from({ length: Math.min(Math.max(0, ...done.map(x => x.r.wrong ?? 0)), 15) + 1 }, (_, w) => ({ label: (w === 15 ? '15+' : w) + '개', n: done.filter(x => (w === 15 ? x.r.wrong >= 15 : x.r.wrong === w)).length }))
    : [...Array(10)].map((_, i) => ({ label: `${i * 10}~`, n: scores.filter(p => Math.min(9, Math.floor(p / 10)) === i).length }));
  const late = r => t.due_at && new Date(r.submitted_at) > new Date(t.due_at);
  let urls = {};
  const statusCell = r => r ? `<span class="small">${fmtDate(r.submitted_at)}</span>${late(r) ? ' ' + badge('지각', 'warn') : ''}${editBadges(r)}` : '-';
  main.innerHTML = `<a href="#/t/vocab" class="back">← 테스트</a><h1 class="page">${catBadge(t)}${esc(t.title)}</h1>
    <div class="grid stats">${stat(`${done.length} / ${rows.length}`, self ? '제출' : '점수 입력')}${stat(avg == null ? '-' : avg + '점', '평균 (100점 환산)')}
      ${stat(scores.length ? Math.max(...scores) + '점' : '-', '최고')}${stat(scores.length ? Math.min(...scores) + '점' : '-', '최저')}</div>
    ${done.length ? `<div class="card"><h2>${self ? '틀린 개수 분포' : '점수 분포 (100점 환산)'}</h2><div class="hist">${buckets.map(b => `<div><b>${b.n || ''}</b><i style="height:${b.n ? b.n / Math.max(...buckets.map(x => x.n)) * 70 : 0}%"></i><span>${b.label}</span></div>`).join('')}</div></div>` : ''}
    <div class="card"><div class="flex between wrap"><h2>${self ? '학생별 결과' : '점수 입력'}</h2>
      <div class="flex wrap">${t.pdf_path ? '<button class="btn sm" id="pdf">📄 시험지</button>' : ''}<button class="btn sm" id="miss">${self ? '미제출' : '미입력'} 학생</button><button class="btn sm" id="csv">엑셀로 받기</button></div></div>
      ${!rows.length ? empty('대상 학생이 없어요') : self ? `<div class="tbl-wrap"><table><thead><tr><th>이름</th><th>틀린 개수</th><th>점수</th><th>제출</th><th>사진</th><th>질문·메모</th></tr></thead><tbody>
      ${rows.map(({ s, r }) => `<tr><td><a href="#/t/student/${s.id}">${esc(s.full_name)}</a><br><span class="small muted">${esc(className(s.class_id))}</span></td>
        <td>${r ? `<div class="flex"><input type="number" min="0" max="${t.total}" value="${r.wrong ?? ''}" data-w="${r.id}" style="width:70px;padding:6px" aria-label="틀린 개수"><button class="btn sm" data-save="${r.id}">수정</button></div>` : '<span class="muted">-</span>'}</td>
        <td>${vocabBadge(t, r)}</td><td>${statusCell(r)}</td>
        <td>${r && (r.files || []).length ? `<div class="thumbs">${r.files.map((f, i) => isImg(f) ? `<img class="thumb-s" data-p="${esc(f.path)}" data-r="${r.id}" data-i="${i}" alt="">` : `<button class="btn sm" data-file="${esc(f.path)}">📎</button>`).join('')}</div>` : ''}</td>
        <td class="small" style="max-width:220px">${esc(r?.memo || '')}</td></tr>`).join('')}</tbody></table></div>`
      : `<details style="margin-bottom:12px"><summary>📋 엑셀에서 붙여넣기</summary>
          <p class="small muted">엑셀에서 <b>이름 | 점수${t.use_grade ? ' | 등급 | 백분위' : ''}</b> 순서의 칸을 복사해서 붙여넣으세요. (한 줄에 한 명)</p>
          <textarea id="paste" style="min-height:90px" placeholder="김민준&#9;84${t.use_grade ? '&#9;2&#9;91' : ''}"></textarea>
          <button class="btn sm" id="applyPaste" style="margin-top:8px">표에 채우기</button></details>
        <div class="tbl-wrap"><table><thead><tr><th>이름</th><th>점수 <span class="muted">/ ${t.total}</span></th>${t.use_grade ? '<th>등급</th><th>백분위</th>' : ''}<th>메모</th><th>환산</th></tr></thead><tbody>
        ${rows.map(({ s, r }) => `<tr data-uid="${s.id}"><td><a href="#/t/student/${s.id}">${esc(s.full_name)}</a><br><span class="small muted">${esc(className(s.class_id))}</span></td>
          <td><input type="number" step="any" min="0" max="${t.total}" data-k="score" value="${r?.score ?? ''}" style="width:90px;padding:6px" aria-label="${esc(s.full_name)} 점수"></td>
          ${t.use_grade ? `<td><input type="number" min="1" max="9" data-k="grade" value="${r?.grade ?? ''}" style="width:64px;padding:6px" aria-label="등급"></td>
            <td><input type="number" step="any" min="0" max="100" data-k="percentile" value="${r?.percentile ?? ''}" style="width:76px;padding:6px" aria-label="백분위"></td>` : ''}
          <td><input data-k="memo" value="${esc(r?.memo || '')}" placeholder="메모" style="padding:6px" aria-label="메모"></td>
          <td>${vocabBadge(t, r)}</td></tr>`).join('')}</tbody></table></div>
        <div class="right"><button class="btn primary" id="saveAll">모두 저장</button></div>`}</div>
    <div class="card"><h2>테스트 정보 수정</h2><form id="f" data-id="${t.id}">${vocabForm(t, d.videos, cats)}<button class="btn primary">저장</button></form></div>`;
  document.getElementById('pdf')?.addEventListener('click', () => openFile('materials', t.pdf_path));
  document.getElementById('miss').onclick = () => showPeople(`'${t.title}' ${self ? '미제출' : '점수 미입력'}`, rows.filter(x => !(x.r && tRaw(t, x.r) != null)).map(x => x.s),
    { title: `📚 ${t.category} 안내`, body: `'${t.title}' 결과를 아직 적지 않았어요.${t.due_at ? ` (마감 ${fmtDate(t.due_at)})` : ''}`, url: `./#/vocab/${t.id}` });
  document.getElementById('csv').onclick = () => downloadCSV(`${t.title}.csv`, [['이름', '반', self ? '틀린 개수' : '점수', '100점 환산', '등급', '백분위', '제출/입력 시간', '수정 횟수', '마감 후 수정', '메모'],
    ...rows.map(({ s, r }) => [s.full_name, className(s.class_id), r ? (self ? r.wrong : r.score) : '', r ? vocabScore(t, r) : '', r?.grade, r?.percentile, r ? fmtDate(r.submitted_at) : '', r?.edit_count || '', r?.edited_after_due ? 'O' : '', r?.memo])]);
  document.getElementById('applyPaste')?.addEventListener('click', () => {
    const norm = x => String(x || '').replace(/\s/g, '');
    const lines = document.getElementById('paste').value.split(/\r?\n/).map(l => l.split(/\t|,/).map(c => c.trim())).filter(c => c[0]);
    const missing = [];
    lines.forEach(([name, sc, gr, pc]) => {
      const row = rows.find(x => norm(x.s.full_name) === norm(name));
      if (!row) return missing.push(name);
      const tr = main.querySelector(`tr[data-uid="${row.s.id}"]`);
      tr.querySelector('[data-k=score]').value = sc ?? '';
      if (t.use_grade) { tr.querySelector('[data-k=grade]').value = gr ?? ''; tr.querySelector('[data-k=percentile]').value = pc ?? ''; }

      return lightbox(imgs.map(f => ({ url: urls[f.path], name: `${s.full_name} · ${f.name}` })), imgs.indexOf(r.files[+im.dataset.i])); }
    const sv = e.target.closest('[data-save]');
    if (sv) { const v = Math.max(0, Math.min(t.total, +main.querySelector(`[data-w="${sv.dataset.save}"]`).value | 0));
      await q(sb.from('vocab_results').update({ wrong: v }).eq('id', sv.dataset.save)); toast('고쳤어요'); route(); }
  });
  const f = document.getElementById('f'); wireVocabForm(f);
  f.onsubmit = async e => { e.preventDefault(); const btn = f.querySelector('button.primary'); busy(btn, true);
    try { await saveVocab(f, t); toast('저장했어요'); route(); } catch (err) { busy(btn, false); } };
  urls = await signUrls('submissions', rs.flatMap(r => (r.files || []).filter(isImg).map(f => f.path)));
  main.querySelectorAll('img[data-p]').forEach(im => { im.src = urls[im.dataset.p] || ''; });
}

/* ---------- 수정 기록 (바꿔치기 확인) ---------- */
function editBadges(x) {
  if (!x) return '';
  return `${x.edit_count ? ' ' + badge(`수정 ${x.edit_count}회`) : ''}${x.edited_after_due ? ' ' + badge('마감 후 수정', 'bad') : ''}` +

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64ToU8(str) { const pad = '='.repeat((4 - str.length % 4) % 4); const raw = atob((str + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
async function pushState() {
  if (!pushSupported()) return isIOS && !isStandalone() ? 'ios-install' : 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  try { const reg = await navigator.serviceWorker.getRegistration(); const sub = await reg?.pushManager.getSubscription();
    return sub && Notification.permission === 'granted' ? 'on' : 'off'; } catch (e) { return 'off'; }
}
async function enablePush(btn) {
  if (!pushSupported()) return installApp();
  busy(btn, true, '켜는 중…');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('알림이 허용되지 않았어요. 폰 설정에서 이 앱(사이트)의 알림을 허용해 주세요.', 'err'); return; }
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    const { data, error } = await sb.functions.invoke('push', { body: { action: 'key' } });
    if (error || !data?.publicKey) throw error || new Error('알림 키를 받지 못했어요');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(data.publicKey) });
    const j = sub.toJSON();
    await q(sb.rpc('save_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent }));
    toast('알림을 켰어요 🔔'); fillPushBar();
  } catch (e) { console.error(e); toast('알림을 켜지 못했어요: ' + (e.message || e), 'err'); }
  finally { busy(btn, false); }
}
async function fillPushBar() {
  const el = document.getElementById('pushbar'); if (!el) return;
  const st = await pushState();
  const who = state.profile.role === 'parent' ? '자녀의 미제출·마감 알림' : isStaff() ? '테스트용 알림' : '새 테스트·마감 알림';
  const html = {
    off: `<div class="pushbar"><span style="font-size:24px">🔔</span><div><b>알림 켜기</b><br><span class="muted small">${who}을 폰으로 받아요. (무료)</span></div><button class="btn sm primary" id="pushOn">켜기</button></div>`,
    'ios-install': `<div class="pushbar"><span style="font-size:24px">🔔</span><div><b>아이폰은 앱을 설치해야 알림이 와요</b><br><span class="muted small">홈 화면에 추가한 뒤, 앱에서 알림을 켜 주세요.</span></div><button class="btn sm" data-install>설치 방법</button></div>`,
    denied: `<div class="pushbar"><span style="font-size:24px">🔕</span><div><b>알림이 차단돼 있어요</b><br><span class="muted small">폰 설정 → 알림에서 이 앱(또는 브라우저)의 알림을 허용해 주세요.</span></div></div>`,
    on: isStaff() ? `<div class="pushbar"><span style="font-size:24px">🔔</span><div><b>이 기기 알림 켜짐</b></div><button class="btn sm" id="pushTest">테스트 알림</button></div>` : '',
    unsupported: ''
  }[st];
  el.innerHTML = html;
  document.getElementById('pushOn')?.addEventListener('click', e => enablePush(e.currentTarget));
  document.getElementById('pushTest')?.addEventListener('click', async e => {
    busy(e.currentTarget, true);
    const { data, error } = await sb.functions.invoke('push', { body: { action: 'test' } });
    busy(e.currentTarget, false);
    toast(error ? '실패: ' + error.message : data.devices ? '테스트 알림을 보냈어요' : '이 계정에 등록된 기기가 없어요', error ? 'err' : '');
  });
}

const shortTitle = (t, cat) => { let x = String(t || ''); if (cat) x = x.replace(cat, ''); return x.replace(/ ?어휘 ?테스트/, '').trim() || t; };
function cmp(a, b) { if (a == null || b == null) return ''; const d = Math.round(a - b); return d > 0 ? `<span class="up">▲${d}</span>` : d < 0 ? `<span class="down">▼${-d}</span>` : '<span class="muted">=</span>'; }
function lineChart(items) {
  if (!items.length) return empty('아직 점수가 없어요');
  const narrow = innerWidth < 640, W = narrow ? 360 : 640, H = narrow ? 230 : 230, L = 30, R = narrow ? 30 : 40, T = 26, B = 36, n = items.length;
  const x = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1), y = v => T + (100 - v) * (H - T - B) / 100;
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#ebe8e1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#8a8f9c">${v}</text>`).join('');
  const line = (k, color, dash) => { const pts = items.map((it, i) => it[k] == null ? null : `${x(i)},${y(it[k])}`).filter(Boolean);
    return pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="${dash ? 2 : 3}" ${dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>` : ''; };
  const dots = items.map((it, i) => it.mine == null ? '' : `<circle cx="${x(i)}" cy="${y(it.mine)}" r="4.5" fill="var(--primary)"/><text x="${x(i)}" y="${y(it.mine) - 9}" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2230">${it.mine}</text>`).join('');
  const labels = items.map((it, i) => `<text x="${x(i)}" y="${H - 14}" text-anchor="middle" font-size="10" fill="#8a8f9c">${esc(trunc(it.label, 9))}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="점수 변화">${grid}${line('avg', '#b9bcc6', true)}${line('mine', 'var(--primary)')}${dots}${labels}</svg>
    <div class="legend"><span><i style="background:var(--primary)"></i>내 점수</span><span><i style="background:#b9bcc6"></i>반 평균</span></div>`;
}

                  assignments: tAssignments, assignment: tAssignment, vocab: c => c ? tVocab(c) : tVocabList(), report: tReport };
  if (!b) return tDash();
  if (b === 'records') return tRecords(c, d, e, f);
  if (pages[b]) return pages[b](c);
  location.hash = '/t';
}

async function loadTeacherData() {
  const [profiles, videos, assignments, progress, subs, vtests, vres, plinks, pushes] = await Promise.all([
    fetchAll('profiles', '*', b => b.order('full_name')),
    fetchAll('videos', '*', b => b.order('created_at')),
    fetchAll('assignments', '*', b => b.order('created_at')),
    fetchAll('video_progress', 'id,user_id,video_id,percent,completed,last_watched_at,total_watch_seconds'),
    fetchAll('submissions', 'id,assignment_id,user_id,submitted_at,score,graded_at'),
    fetchAll('vocab_tests', '*', b => b.order('open_at')),
    fetchAll('vocab_results', 'id,test_id,user_id,wrong,score,grade,percentile,submitted_at,edit_count,edited_after_due'),
    q(sb.from('parent_links').select('parent_id,student_id')),
    fetchAll('push_subscriptions', 'id,user_id')
  ]);
  state.pushUsers = new Set(pushes.map(x => x.user_id));
  const pmap = Object.fromEntries(profiles.map(p => [p.id, p]));
  state.parentsByStudent = {}; state.childrenByParent = {};
  plinks.forEach(l => { const par = pmap[l.parent_id], kid = pmap[l.student_id]; if (!par || !kid) return;
    if (par.status === 'approved') (state.parentsByStudent[l.student_id] ||= []).push(par);
    (state.childrenByParent[l.parent_id] ||= []).push(kid); });
  const prog = {}, sub = {}, voc = {};
  vres.forEach(r => voc[key(r.user_id, r.test_id)] = r);
  progress.forEach(r => prog[key(r.user_id, r.video_id)] = r);
  subs.forEach(r => sub[key(r.user_id, r.assignment_id)] = r);
  const students = profiles.filter(p => p.role === 'student');
  const approved = students.filter(s => s.status === 'approved');
  return { profiles, students, approved, videos, assignments, prog, sub, vtests, voc };
}

function matrix(rows, cols, cell, act) {
  if (!rows.length) return empty('승인된 학생이 없어요');
  if (!cols.length) return empty('아직 항목이 없어요');
  return `<div class="mx-wrap"><table class="mx"><thead><tr><th class="sticky">학생</th>
    ${cols.map(c => `<th><button class="linkbtn" data-act="${act}" data-id="${c.id}" title="${esc(c.title)}">${esc(trunc(c.title, 9))}</button></th>`).join('')}</tr></thead>
    <tbody>${rows.map(s => `<tr><td class="sticky"><a href="#/t/student/${s.id}">${esc(s.full_name || s.email)}</a></td>
      ${cols.map(c => `<td>${cell(s, c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function cellV(d, s, v) {
  if (!isTarget(v, s)) return '<span class="na">·</span>';
  const p = d.prog[key(s.id, v.id)], pct = p?.percent || 0;
  return `<span class="cell ${p?.completed ? 'ok' : pctClass(pct)}" title="${p ? '마지막 시청 ' + fmtDate(p.last_watched_at) : '안 봄'}">${p?.completed ? '✓' : pct + '%'}</span>`;
}
function cellA(d, s, a) {
  if (!isTarget(a, s)) return '<span class="na">·</span>';
  const x = d.sub[key(s.id, a.id)];
  if (x?.graded_at) return `<span class="cell ok">${esc(x.score ?? '✓')}점</span>`;
  if (x) return `<span class="cell ${isLate(a, x) ? 'warn' : 'ok'}">${isLate(a, x) ? '지각' : '제출'}</span>`;
  return `<span class="cell ${a.due_at && new Date(a.due_at) < Date.now() ? 'bad' : ''}">✗</span>`;
}
const notDoneV = (d, v, studs) => studs.filter(s => isTarget(v, s) && !d.prog[key(s.id, v.id)]?.completed);
const notDoneA = (d, a, studs) => studs.filter(s => isTarget(a, s) && !d.sub[key(s.id, a.id)]);

      asg.forEach(a => { if (isTarget(a, s)) { at++; if (d.sub[key(s.id, a.id)]) ad++; } });
    });

        ${stat(studs.length + '명', '학생')}

        ${stat(pctStr(ad, at), '숙제 제출률')}
        ${stat(ungraded + '건', '채점 대기')}

      </div>
      ${usageCard(usage)}
      <div class="card"><div class="flex between wrap"><h2>영상 진도표</h2>
        <div class="flex"><span class="muted small">영상 제목을 누르면 안 본 학생이 나와요</span><button class="btn sm" data-act="csvV">엑셀로 받기</button></div></div>

        <div class="flex"><span class="muted small">숙제 제목을 누르면 미제출 학생이 나와요</span><button class="btn sm" data-act="csvA">엑셀로 받기</button></div></div>
        ${matrix(studs, asg, (s, a) => cellA(d, s, a), 'missA')}</div>
      <div class="card"><div class="flex between wrap"><div class="flex"><h2 style="margin:0">테스트 점수표</h2>
          <select id="vcat" style="width:auto;padding:5px 8px"><option value="">모든 종류</option>${vcats.map(c => `<option ${c === vcat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>

      if (act === 'missVo') { const t = d.vtests.find(x => x.id === id); showPeople(`'${t.title}' 결과 없음`, studs.filter(s => isTarget(t, s) && !(d.voc[key(s.id, t.id)] && tRaw(t, d.voc[key(s.id, t.id)]) != null)), { title: `📚 ${t.category} 안내`, body: `'${t.title}' 결과를 아직 적지 않았어요.${t.due_at ? ` (마감 ${fmtDate(t.due_at)})` : ''}`, url: `./#/vocab/${t.id}` }); }
      if (act === 'csvVo') downloadCSV('테스트점수.csv', [['이름', '반', '이메일', ...vts.map(t => `[${t.category}] ${t.title} (/${t.total})`)],
        ...studs.map(s => [s.full_name, className(s.class_id), s.email, ...vts.map(t => { if (!isTarget(t, s)) return ''; const r = d.voc[key(s.id, t.id)]; const v = tRaw(t, r); return v == null ? (t.grading === 'self' ? '미제출' : '') : v; })])]);
      if (act === 'csvV') downloadCSV('영상진도.csv', [['이름', '반', '이메일', ...vids.map(v => v.title)],
        ...studs.map(s => [s.full_name, className(s.class_id), s.email, ...vids.map(v => !isTarget(v, s) ? '' : (d.prog[key(s.id, v.id)]?.percent || 0) + '%')])]);
      if (act === 'csvA') downloadCSV('숙제제출.csv', [['이름', '반', '이메일', ...asg.map(a => a.title)],
        ...studs.map(s => [s.full_name, className(s.class_id), s.email, ...asg.map(a => { if (!isTarget(a, s)) return ''; const x = d.sub[key(s.id, a.id)];
          return x?.graded_at ? x.score : x ? (isLate(a, x) ? '지각제출' : '제출') : '미제출'; })])]);
    };
  };
  draw();
  fillPushBar();
}

async function tStudents() {
  const main = layout('/t/students');
  const d = await loadTeacherData();

  const pendingN = d.profiles.filter(s => s.status === 'pending' && ['student', 'parent'].includes(s.role)).length;
  if (pendingN) f.status = 'pending';
  main.innerHTML = `<h1 class="page">학생 관리</h1>
    <div class="card"><div class="flex wrap">
      <input id="q" placeholder="이름·이메일·전화번호 검색" style="max-width:260px">
      <select id="fr" style="width:auto"><option value="">학생+학부모</option><option value="student">학생만</option><option value="parent">학부모만</option><option value="assistant">조교</option></select>

      <button class="btn sm" id="csv" style="margin-left:auto">엑셀로 받기</button></div></div>
    <div id="bulk"></div><div class="card tbl-wrap" id="tbl"></div>`;
  document.getElementById('fs').value = f.status;

    .filter(p => (!f.role || p.role === f.role) && (!f.cls || (f.cls === 'none' ? !p.class_id : p.class_id === f.cls)) && (!f.status || p.status === f.status)

    .map(([v, l]) => `<option value="${v}" ${p.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const draw = () => {
    const list = filtered();
    const pubV = d.videos.filter(v => v.published);
    document.getElementById('tbl').innerHTML = list.length ? `<table><thead><tr><th><input type="checkbox" id="all"></th><th>이름</th><th>연락처</th><th>반 / 자녀</th><th>상태</th><th>영상 완료</th><th>숙제 제출</th><th>🔔</th><th>가입일</th></tr></thead><tbody>
      ${list.map(p => { const vs = pubV.filter(v => isTarget(v, p)), as = d.assignments.filter(a => isTarget(a, p));
        const vd = vs.filter(v => d.prog[key(p.id, v.id)]?.completed).length, ad = as.filter(a => d.sub[key(p.id, a.id)]).length;
        return `<tr><td><input type="checkbox" data-sel="${p.id}" ${sel.has(p.id) ? 'checked' : ''}></td>
          <td><a href="#/t/student/${p.id}"><b>${esc(p.full_name || '(이름 없음)')}</b></a>${p.role === 'teacher' ? ' ' + badge('선생님', 'blue') : p.role === 'assistant' ? ' ' + badge('조교', 'blue') : p.role === 'parent' ? ' ' + badge('학부모', 'warn') : ''}</td>
          <td class="small">${esc(p.email)}<br><span class="muted">${esc(p.phone || '')}</span></td>
          <td>${p.role === 'parent' ? `<span class="small">${(state.childrenByParent[p.id] || []).map(k => esc(k.full_name)).join(', ') || '<span class="muted">연결 없음</span>'}</span>` : `<select data-f="class_id" data-id="${p.id}"><option value="">미배정</option>${classOptions(p.class_id)}</select>`}</td>
          <td>${statusSel(p)}</td>
          <td>${p.role === 'student' ? `${vd}/${vs.length}` : '-'}</td><td>${p.role === 'student' ? `${ad}/${as.length}` : '-'}</td><td>${state.pushUsers.has(p.id) ? '✓' : ''}</td>
          <td class="small muted">${fmtDate(p.created_at, false)}</td></tr>`; }).join('')}</tbody></table>`
      : empty('조건에 맞는 학생이 없어요');
    document.getElementById('bulk').innerHTML = sel.size ? `<div class="bulk flex wrap"><b>${sel.size}명 선택</b>
      <button class="btn sm primary" data-bulk="approve">승인</button><button class="btn sm" data-bulk="reject">거절</button>
      <select id="bulkCls" style="width:auto;padding:5px 8px"><option value="">반 이동…</option>${classOptions('')}</select>
      <button class="btn sm" data-bulk="clear">선택 해제</button></div>` : '';
    const all = document.getElementById('all');
    if (all) all.checked = list.length > 0 && list.every(p => sel.has(p.id));
  };
  const update = async (ids, patch, msg) => {
    await q(sb.from('profiles').update(patch).in('id', ids));
    d.profiles.forEach(p => { if (ids.includes(p.id)) Object.assign(p, patch); });
    toast(msg || '저장했어요'); draw();
  };

  document.getElementById('fc').onchange = e => { f.cls = e.target.value; draw(); };

  main.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'all') { filtered().forEach(p => t.checked ? sel.add(p.id) : sel.delete(p.id)); draw(); }
    else if (t.dataset.sel) { t.checked ? sel.add(t.dataset.sel) : sel.delete(t.dataset.sel); draw(); }
    else if (t.dataset.f) await update([t.dataset.id], { [t.dataset.f]: t.value || null });
    else if (t.id === 'bulkCls' && t.value) await update([...sel], { class_id: t.value }, `${sel.size}명을 '${className(t.value)}' 반으로 옮겼어요`);
  });
  main.addEventListener('click', async e => {
    const b = e.target.closest('[data-bulk]'); if (!b) return;
    const ids = [...sel];
    if (b.dataset.bulk === 'approve') await update(ids, { status: 'approved' }, `${ids.length}명을 승인했어요`);
    if (b.dataset.bulk === 'reject' && confirm(`${ids.length}명을 거절할까요?`)) await update(ids, { status: 'rejected' }, '거절했어요');
    if (b.dataset.bulk === 'clear') { sel.clear(); draw(); }
  });
  draw();
}

    }
  });

async function saveAssignment(f, existing) {
  const row = { title: f.title.value.trim(), description: f.description.value.trim() || null, class_id: f.class_id.value || null,
                due_at: f.due_at.value ? new Date(f.due_at.value).toISOString() : null, video_id: f.video_id.value || null, lock_after_due: f.lock_after_due.checked };
  const file = f.file.files[0];
  if (file) {
    row.file_path = `${crypto.randomUUID()}.${fileExt(file.name)}`; row.file_name = file.name;
    await q(sb.storage.from('materials').upload(row.file_path, file, { contentType: file.type || undefined }));
    if (existing?.file_path) await sb.storage.from('materials').remove([existing.file_path]);

}
