/* ---------- 수업 기록 판정 · 문자 (시트 규칙과 같게) ---------- */
const REC = (() => {
  const md = d => { const x = new Date(d + 'T00:00:00'); return `${x.getMonth() + 1}/${x.getDate()}`; };
  const num = v => (v === null || v === undefined || v === '' ? null : +v);
  // 숙제 판정: ok | perfect | poor | missing | wrong | null
  function hwJudge(status, rate, cut) {
    rate = num(rate);
    if (status === '미제출' || status === '결석') return 'missing';
    if (status === '잘못 제출') return 'wrong';
    if (status === '미흡') return 'poor';
    if (status === '완벽') return 'perfect';
    if (status === '제출' || (!status && rate != null)) {
      if (rate != null) { if (rate === 0) return 'missing'; if (rate < cut) return 'poor'; }
      return 'ok';
    }
    return null;
  }
  // 테스트 판정: pass | fail | absent | exempt | record | null
  function testJudge(mode, cut, val, flag) {
    val = num(val);
    if (!mode) return null;
    if (flag === '면제') return 'exempt';
    if (mode === 'record') return val == null ? null : 'record';
    if (val == null || flag === '결석') return 'absent';
    if (mode === 'take') return 'pass';
    if (mode === 'score') return val < cut ? 'fail' : 'pass';
    return Math.abs(val) >= cut ? 'fail' : 'pass';
  }
  const wrongTxt = v => { v = Math.abs(num(v)); return v === 0 ? '0' : `-${v}`; };
  // 한 사람의 한 수업일 항목들
  function items(day, rec, S) {
    const out = [], hwCut = +S.hw_cut || 70, defCut = +S.default_cut || 4;
    if (!rec) return out;
    const hws = [['hw1', day.hw1_sms || day.hw1, rec.hw1, rec.hw1_done, rec.rate], ['hw2', day.hw2, rec.hw2, rec.hw2_done, rec.hw2_rate]];
    for (const [k, name, st, done, rate] of hws) {
      if (!name) continue;
      const j = hwJudge(st, rate, hwCut);
      if (!j) continue;
      const bad = ['missing', 'wrong', 'poor'].includes(j);
      let text;
      if (j === 'ok') text = num(rate) != null ? `달성률 ${(+rate).toFixed(1)}%` : '제출 완료';
      else if (j === 'perfect') text = '완벽';
      else if (j === 'poor') text = `미흡${num(rate) != null ? `(${(+rate).toFixed(1)}%)` : ''} → ${done ? '보완 완료' : '보완 필요'}`;
      else if (j === 'wrong') text = `잘못 제출 → ${done ? '이후 제출 완료' : '원래 숙제 제출 필요'}`;
      else text = `${st === '결석' ? '결석' : '미제출'} → ${done ? '이후 제출 완료' : '제출 필요'}`;
      out.push({ key: k, kind: 'hw', name, j, bad, done: done || null, line: `· 숙제(${name}): ${text}`,
        todo: j === 'poor' ? `${name} 보완` : `${name} 제출`, short: j === 'poor' ? '미흡' : j === 'wrong' ? '잘못 제출' : j === 'missing' ? '미제출' : j === 'perfect' ? '완벽' : '제출' });
    }
    for (const t of ['t1', 't2']) {
      const name = day[t + '_name'], mode = day[t + '_mode'];
      if (!name || !mode) continue;
      const cut = day[t + '_cut'] != null ? +day[t + '_cut'] : defCut;
      const val = rec[t], flag = rec[t + '_flag'], done = rec[t + '_done'];
      const j = testJudge(mode, cut, val, flag);
      if (!j || j === 'exempt') continue;
      const label = `${name} 테스트`, sc = mode === 'score' || mode === 'record';
      let text, short;
      if (j === 'pass') { text = mode === 'take' ? '응시' : sc ? `${+val}점 통과` : `통과(${wrongTxt(val)})`; short = sc ? `통과(${+val}점)` : `통과(${wrongTxt(val)})`; }
      else if (j === 'record') { text = `${+val}점`; short = `${+val}점`; }
      else if (j === 'fail') { text = `${sc ? `${+val}점 불통과` : `불통과(${wrongTxt(val)})`} → ${done ? '재시험 통과' : '재시험 필요'}`; short = sc ? `불통과(${+val}점)` : `불통과(${wrongTxt(val)})`; }
      else { text = `미응시 → ${done ? '응시 후 통과' : '응시 필요'}`; short = '미응시'; }
      out.push({ key: t, kind: 'test', name, j, bad: j === 'fail' || j === 'absent', done: done || null, line: `· ${label}: ${text}`,
        todo: j === 'fail' ? `${label} 재시험` : `${label} 응시`, doneTxt: j === 'fail' ? `${label} 재응시 후 통과` : `${label} 응시 후 통과`, short });
    }
    return out;
  }
  // 주간 문자. days: 같은 반의 수업일(날짜순), recOf(day) → 이 학생의 기록
  function weekly(student, day, days, recOf, S, notice) {
    const its = items(day, recOf(day), S);
    const dated = days.filter(d => d.day).sort((a, b) => a.day.localeCompare(b.day));
    const prev = dated.filter(d => d.day < day.day);
    const prevDay = prev[prev.length - 1];
    const doneLines = [], openLines = [];
    for (const d of prev) {
      for (const it of items(d, recOf(d), S).filter(x => x.bad)) {
        if (it.done && it.done <= day.day && (!prevDay || it.done > prevDay.day))
          doneLines.push(`· 완료: ${it.kind === 'hw' ? it.todo : it.doneTxt}`);
        else if (!it.done || it.done > day.day)
          openLines.push(`· 미완료(${md(d.day)}): ${it.todo} 필요`);
      }
    }
    let msg = `안녕하세요, ${S.greeting || '송지희국어'}입니다.\n${student.name} 학생의 ${md(day.day)} 수업 결과 전달드립니다.\n\n■ 이번 주\n${its.length ? its.map(x => x.line).join('\n') : '· 기록 없음'}`;
    if (doneLines.length || openLines.length) msg += `\n\n■ 지난 항목\n${[...doneLines, ...openLines].join('\n')}`;
    if ((notice ?? day.notice)) msg += `\n\n■ 안내\n${notice ?? day.notice}`;
    return { msg, items: its, open: openLines.length };
  }
  // 월간 요약
  function monthly(student, days, recOf, S, ym, today) {
    const [y, m] = ym.split('-').map(Number);
    const mdays = days.filter(d => d.day && +d.day.slice(0, 4) === y && +d.day.slice(5, 7) === m);
    let rates = [], miss = 0, poor = 0, pass = 0, fail = 0, absent = 0, hwItems = 0, hwDone = 0, tItems = 0, tDone = 0, left = 0, n = 0;
    for (const d of mdays) {
      const rec = recOf(d); if (!rec) continue; n++;
      const its = items(d, rec, S);
      const h1 = its.find(x => x.key === 'hw1');
      if (h1) { if (h1.j === 'missing') rates.push(0); else if (rec.rate != null && rec.rate !== '') rates.push(+rec.rate); else if (h1.j === 'perfect') rates.push(100); }
      for (const it of its) {
        if (it.kind === 'hw') { if (it.j === 'missing') miss++; if (it.j === 'poor') poor++; }
        else { if (it.j === 'pass') pass++; if (it.j === 'fail') fail++; if (it.j === 'absent') absent++; }
        if (!it.bad) continue;
        const ok = it.done && it.done <= today;
        if (it.kind === 'hw') { hwItems++; if (ok) hwDone++; } else { tItems++; if (ok) tDone++; }
        if (!ok) left++;
      }
    }
    const avg = rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : null;
    const status = (left >= 2 || fail + absent >= 3 || miss >= 2) ? '집중 확인' : (left >= 1 || (avg != null && avg < (+S.hw_cut || 70))) ? '주의' : '양호';
    let msg = `안녕하세요, ${S.greeting || '송지희국어'}입니다.\n${student.name} 학생의 ${m}월 학습 현황 전달드립니다.\n\n■ 숙제`;
    msg += `\n· 평균 달성률: ${avg == null ? '-' : avg.toFixed(1) + '%'}`;
    if (miss) msg += `\n· 미제출: ${miss}회`;
    if (hwItems) msg += `\n· 보완·제출: ${hwItems}건 중 ${hwDone}건 완료`;
    msg += `\n\n■ 테스트\n· 통과 ${pass}회 / 불통과 ${fail}회${absent ? ` / 미응시 ${absent}회` : ''}`;
    if (tItems) msg += `\n· 재시험·응시: ${tItems}건 중 ${tDone}건 통과 완료`;
    msg += `\n\n앞으로도 학습 상태를 꼼꼼히 확인하겠습니다.`;
    return { n, avg, miss, poor, pass, fail, absent, left, hwItems, hwDone, tItems, tDone, status, msg };
  }
  // 아직 해결 안 된 항목 (블랙리스트)
  function open(days, recOf, S, until) {
    const out = [];
    for (const d of days.filter(x => x.day && x.day <= until)) for (const it of items(d, recOf(d), S).filter(x => x.bad && !x.done)) out.push({ day: d, ...it });
    return out;
  }
  // 검사 항목 펼치기: '18-45' → 18..45, '1-10, 15' , 지문은 쉼표로
  function parseItems(unit, text) {
    text = String(text || '').trim(); if (!unit || !text) return [];
    if (unit === 'name') return text.split(/[,，\n]/).map(x => x.trim()).filter(Boolean);
    const out = [];
    for (const part of text.split(/[,，\s]+/).filter(Boolean)) {
      const m = part.match(/^(\d+)\s*[-~]\s*(\d+)$/);
      if (m) { const a = +m[1], b = +m[2]; if (b >= a && b - a < 400) for (let i = a; i <= b; i++) out.push(String(i)); }
      else if (/^\d+$/.test(part)) out.push(part);
    }
    return [...new Set(out)];
  }
  const statusFromRate = (rate, cut) => rate == null ? null : rate === 0 ? '미제출' : rate >= 100 ? '완벽' : rate < cut ? '미흡' : '제출';
  return { parseItems, statusFromRate, hwJudge, testJudge, items, weekly, monthly, open, md };
})();

/* =====================================================================
   수업 기록 (구글 시트 대체) – 명단 · 수업일 · 블랙리스트 · 주간/월간 문자
   ===================================================================== */
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const MODES = [['wrong', '틀린 개수'], ['score', '점수'], ['take', '응시만'], ['record', '기록만(판정 없음)']];
const J_CLS = { ok: 'ok', perfect: 'ok', pass: 'ok', record: 'blue', poor: 'warn', wrong: 'warn', missing: 'bad', fail: 'bad', absent: 'bad' };
function smsHref(phone, body) {
  const n = String(phone || '').replace(/[^0-9+]/g, '');
  return isIOS ? `sms:${n}&body=${encodeURIComponent(body)}` : `sms:${n}?body=${encodeURIComponent(body)}`;
}

}

    loadSettings()]);
  const recs = days.length ? await fetchAll('class_records', '*', b => b.in('day_id', days.map(d => d.id))) : [];
  const rm = {}; recs.forEach(r => { rm[r.day_id + '|' + r.roster_id] = r; });
  const asgIds = days.flatMap(d => [d.hw1_asg, d.hw2_asg]).filter(Boolean);
  const subs = {};
  if (asgIds.length) (await fetchAll('submissions', 'id,assignment_id,user_id,files,submitted_at,edit_count,edited_after_due', b => b.in('assignment_id', asgIds)))
    .forEach(x => { subs[x.assignment_id + '|' + x.user_id] = x; });
  const rosterById = Object.fromEntries(roster.map(r => [r.id, r]));
  const prog = {};

  const B = { roster, days, S, recs, rm, subs, rosterById, prog };
  B.sub = (d, k, r) => d[k + '_asg'] && r?.profile_id ? subs[d[k + '_asg'] + '|' + r.profile_id] || null : null;
  B.auto = (d, k, r) => autoHw(d, k, rm[d.id + '|' + r.id], B.sub(d, k, r));
  B.eff = (d, r) => effRec(d, rm[d.id + '|' + r.id], k => B.sub(d, k, r));

function autoHw(d, k, rec, sub) {
  if (!d[k] || !d[k + '_asg'] || (rec && rec[k])) return null;
  if (sub && subFiles(sub).length) return '제출';
  if (d.hw_due && new Date(d.hw_due) < Date.now()) return '미제출';
  return null;
}
function effRec(d, rec, subOf) {
  const a1 = autoHw(d, 'hw1', rec, subOf('hw1')), a2 = autoHw(d, 'hw2', rec, subOf('hw2'));
  if (!a1 && !a2) return rec || null;
  return { ...(rec || {}), ...(a1 ? { hw1: a1 } : {}), ...(a2 ? { hw2: a2 } : {}) };
}

const bump = (name, by = 1) => name ? name.replace(/(\d+)(\s*회)/, (m, n, w) => (+n + by) + w) : name;
// 학부모(앱 알림 받을 사람) 찾기: 명단 → 학생 계정 → 연결된 학부모
async function loadParentsByRoster(roster) {
  const sids = roster.map(r => r.profile_id).filter(Boolean);
  if (!sids.length) return {};
  const links = await q(sb.from('parent_links').select('parent_id,student_id').in('student_id', sids));
  if (!links.length) return {};
  const [pars, subs] = await Promise.all([q(sb.from('profiles').select('id,full_name,phone,status').in('id', [...new Set(links.map(l => l.parent_id))])),
    q(sb.from('push_subscriptions').select('user_id').in('user_id', [...new Set(links.map(l => l.parent_id))]))]);
  const pushOn = new Set(subs.map(s => s.user_id)), pm = Object.fromEntries(pars.filter(p => p.status === 'approved').map(p => [p.id, { ...p, push: pushOn.has(p.id) }]));
  const out = {};
  roster.forEach(r => { if (r.profile_id) out[r.id] = links.filter(l => l.student_id === r.profile_id).map(l => pm[l.parent_id]).filter(Boolean); });
  return out;
}

        ${T.map(t => `<th>${esc(d[t + '_name'])}</th><th>통과일</th>`).join('')}<th>판정</th><th>메모</th><th></th></tr></thead>
        <tbody>${people.map(rowHTML).join('')}</tbody></table></div></div>`;

  // 수업 진도 (자동 저장)
  const pc = main.querySelector('#prog');
  if (pc) { let pt;
    const psave = async () => { const o = { day_id: d.id, updated_at: new Date().toISOString() };
      pc.querySelectorAll('[data-p]').forEach(t => { o[t.dataset.p] = t.value.trim() || null; });
      try { await q(sb.from('class_progress').upsert(o, { onConflict: 'day_id' })); B.prog[d.id] = o; pc.querySelector('#psave').textContent = '저장됨 ✓'; } catch (e) {} };

  // 자주 쓰는 숙제

    f.querySelectorAll('[data-tpl]').forEach(s => { s.innerHTML = `<option value="">자주 쓰는 숙제 불러오기${tpls.length ? '' : ' (아직 없음)'}</option>` + tpls.map(t => `<option value="${t.id}">${esc(t.name)}${t.items ? ' · ' + esc(t.items) : ''}</option>`).join(''); }); };
  fillTpl();
  f.addEventListener('change', e => {
    const s = e.target.closest('[data-tpl]'); if (!s || !s.value) return;

    f[k].value = last ? bump(last.hw1) : t.name; f[k + '_unit'].value = t.unit || ''; f[k + '_items'].value = t.items || ''; f[k + '_photos'].value = t.photos || '';
    s.value = ''; toast(`'${t.name}' 설정을 불러왔어요. 이름의 회차를 확인해 주세요.`);

  f.addEventListener('click', async e => {
    const b = e.target.closest('[data-savetpl]'); if (!b) return;
    const k = b.dataset.savetpl, nm = prompt('어떤 이름으로 저장할까요? (회차 빼고, 예: 송모)', (f[k].value || '').replace(/\s*\d+\s*회.*$/, '').trim());
    if (!nm) return;
    await q(sb.from('hw_templates').upsert({ name: nm.trim(), unit: f[k + '_unit'].value || null, items: f[k + '_items'].value.trim() || null, photos: +f[k + '_photos'].value || null }, { onConflict: 'name' }));

      for (const k of ['hw1', 'hw2']) {
        const items = REC.parseItems(row[k + '_unit'], row[k + '_items']);
        if (row[k + '_unit'] && !items.length) throw toast(`${k === 'hw1' ? '숙제①' : '숙제②'} 검사 범위를 적어 주세요 (예: 18-45)`, 'err');
        if (row[k + '_unit'] === 'page' && !row[k + '_photos']) row[k + '_photos'] = items.length;
        const want = f[k + '_photo'].checked && row[k];
        if (want) {
          if (!row.hw_due) throw toast('사진 제출 마감을 정해 주세요', 'err');
          const md = row.day ? REC.md(row.day) + ' ' : '';
          const desc = [`${cls.name} ${md}수업 숙제예요.`,
            row[k + '_unit'] && items.length ? `검사 범위: ${row[k + '_items']} (${items.length}${unitWord(row[k + '_unit'])})` : '',
            row[k + '_photos'] ? `사진 ${row[k + '_photos']}장 필요` : '',
            '한 장에 한 쪽씩 찍어 주세요. 두 쪽을 한 장에 찍으면 글씨가 작아져서 검사가 안 돼요.'].filter(Boolean).join('\n');
          const asg = { class_id: cls.id, title: `${md}${row[k]}`, description: desc, due_at: row.hw_due, lock_after_due: true, photos_needed: row[k + '_photos'] || null };
          if (d[k + '_asg']) await q(sb.from('assignments').update(asg).eq('id', d[k + '_asg']));
          else row[k + '_asg'] = (await q(sb.from('assignments').insert(asg).select('id').single())).id;
        } else if (d[k + '_asg']) {
          const has = Object.keys(B.subs).some(x => x.startsWith(d[k + '_asg'] + '|'));
          if (has) { toast('이미 사진을 낸 학생이 있어서 사진 제출은 그대로 둘게요', 'err'); }
          else { await q(sb.from('assignments').delete().eq('id', d[k + '_asg'])); row[k + '_asg'] = null; }
        }
      }
      await q(sb.from('class_days').update(row).eq('id', d.id)); toast('저장했어요'); route();
    } catch (err) { busy(btn, false); }
  };
  main.querySelector('#ddel')?.addEventListener('click', async () => {
    if (!confirm('이 수업일과 학생 기록을 모두 지울까요?')) return;
    for (const k of ['hw1_asg', 'hw2_asg']) if (d[k]) await sb.from('assignments').delete().eq('id', d[k]);
    await q(sb.from('class_days').delete().eq('id', d.id)); toast('삭제했어요'); location.hash = '/t/records/' + cls.id;
  });

  // 칸 바꾸면 자동 저장
  const timers = {};
  const collect = tr => { const o = {};
    tr.querySelectorAll('[data-k]').forEach(el => { const k = el.dataset.k; let val = el.value.trim();
      if (['rate', 'hw2_rate', 't1', 't2'].includes(k)) val = val === '' ? null : +val; else val = val || null;
      if ((k === 'rate' || k === 'hw2_rate') && val != null) val = Math.max(0, Math.min(100, val));
      o[k] = val; });
    return o; };
  const save = async tr => {
    const rid = tr.dataset.r, o = collect(tr), cur = B.rm[d.id + '|' + rid];
    try {
      if (cur) { const up = await q(sb.from('class_records').update({ ...o, updated_at: new Date().toISOString() }).eq('id', cur.id).select().single()); B.rm[d.id + '|' + rid] = up; }
      else { if (Object.values(o).every(v => v == null)) return;
        const ins = await q(sb.from('class_records').insert({ day_id: d.id, roster_id: rid, ...o }).select().single()); B.rm[d.id + '|' + rid] = ins; B.recs.push(ins); }
      tr.querySelector('[data-j]').innerHTML = judgeCell(B.rosterById[rid]);
      tr.style.background = '#f0faf4'; setTimeout(() => tr.style.background = '', 600);
    } catch (e) {}
  };
  main.querySelector('tbody').addEventListener('change', e => {
    const tr = e.target.closest('tr[data-r]'); if (!tr) return;
    clearTimeout(timers[tr.dataset.r]); timers[tr.dataset.r] = setTimeout(() => save(tr), 250);
  });

  // 문자 · 알림
  let parentsP = null;
  const getParents = () => parentsP ||= loadParentsByRoster(B.roster);
  const weeklyOf = r => REC.weekly(r, d, B.days, B.recOf(r.id), B.S);
  const pushText = (r, w) => ({ title: `${r.name} 학생 ${REC.md(d.day)} 수업 결과`,
    body: `${w.items.map(x => x.short).join(' · ') || '수업 결과가 올라왔어요'}${w.open ? ` · 미완료 ${w.open}건` : ''} (눌러서 자세히 보기)` });
  main.querySelector('tbody').addEventListener('click', async e => {
    const b = e.target.closest('[data-msg]'); if (!b) return;
    const r = B.rosterById[b.dataset.msg], w = weeklyOf(r), parents = (await getParents())[r.id] || [], pt = pushText(r, w);
    messageModal(r, w.msg, { title: `${REC.md(d.day)} 주간 문자`, parents, recId: B.rm[d.id + '|' + r.id]?.id, pushTitle: pt.title, pushBody: pt.body,
      onSent: () => { b.textContent = '문자 ✓'; } });
  });
  main.querySelector('#allmsg')?.addEventListener('click', async () => {
    const parents = await getParents();
    const list = people.filter(r => r.status === '재원' && B.eff(d, r));
    const pushOf = r => (parents[r.id] || []).filter(p => p.push);
    const withPush = list.filter(r => pushOf(r).length), noPush = list.filter(r => !pushOf(r).length);
    const line = r => { const x = B.rm[d.id + '|' + r.id], w = weeklyOf(r);
      return `<div class="flex between" style="gap:8px" data-row="${r.id}"><span><b>${esc(r.name)}</b> <span data-st>${x?.sent_at ? badge('보냄 ✓', 'ok') : ''}</span><br>
        <span class="small muted">${w.items.map(i => esc(i.short)).join(' · ')}${w.open ? ` · <span style="color:var(--bad)">미완료 ${w.open}</span>` : ''}</span></span>
        <span class="flex" style="flex-shrink:0">${r.parent_phone && r.sms !== false ? `<a class="btn sm" data-sms="${r.id}" href="#">📱 문자</a>` : '<span class="small muted">번호 없음</span>'}<button class="btn sm" data-one="${r.id}">보기</button></span></div>`; };
    const m = modal(`<h2>${REC.md(d.day)} 주간 결과 보내기 <span class="muted small">${list.length}명</span></h2>
      <div style="background:var(--surface-1, #f6f5f1);border-radius:10px;padding:12px 14px;margin-bottom:12px">
        <b>🔔 앱 알림 (무료)</b> <span class="muted small">— 알림을 켠 학부모 ${withPush.length}명</span><br>
        <span class="small muted">각자 자기 아이 결과가 짧게 가고, 누르면 앱에서 자세히 보여요.</span>
        <div style="margin-top:8px">${withPush.length ? `<button class="btn primary" id="pushall">${withPush.length}명에게 한 번에 보내기</button>` : '<span class="small">아직 알림을 켠 학부모가 없어요.</span>'}</div></div>
      <b>📱 문자로 보낼 사람</b> <span class="muted small">— 앱 알림을 못 받는 ${noPush.length}명</span>
      <div class="people" style="max-height:45vh;margin-top:6px">${noPush.map(line).join('') || '<p class="small muted">없어요! 전부 앱 알림으로 갔어요.</p>'}</div>
      ${withPush.length ? `<details style="margin-top:8px"><summary class="small" style="font-weight:700">앱 알림 받는 ${withPush.length}명 보기</summary><div class="people">${withPush.map(line).join('')}</div></details>` : ''}
      <div class="flex wrap" style="margin-top:10px"><button class="btn" id="cpall">문자 전체 복사</button><button class="btn" data-close>닫기</button></div>`);
    const markSent = async r => { const rec = B.rm[d.id + '|' + r.id], now = new Date().toISOString();
      if (rec) { await sb.from('class_records').update({ sent_at: now }).eq('id', rec.id); rec.sent_at = now; }
      else { const ins = await q(sb.from('class_records').insert({ day_id: d.id, roster_id: r.id, sent_at: now }).select().single()); B.rm[d.id + '|' + r.id] = ins; }
      m.querySelectorAll(`[data-row="${r.id}"] [data-st]`).forEach(x => x.innerHTML = badge('보냄 ✓', 'ok'));
      const mb = main.querySelector(`[data-msg="${r.id}"]`); if (mb) mb.textContent = '문자 ✓'; };
    m.querySelector('#pushall')?.addEventListener('click', async e => {
      const btn = e.currentTarget;
      if (!confirm(`학부모 ${withPush.length}명에게 각자 아이의 ${REC.md(d.day)} 수업 결과 알림을 보낼까요?`)) return;
      busy(btn, true, '보내는 중…'); let ok = 0, fail = 0;
      for (const r of withPush) {
        const pt = pushText(r, weeklyOf(r));
        const { data, error } = await sb.functions.invoke('push', { body: { action: 'send', user_ids: pushOf(r).map(p => p.id), title: pt.title, body: pt.body, url: r.profile_id ? `./#/child/${r.profile_id}` : './' } });
        if (error || data?.error) fail++; else { ok++; await markSent(r); }
      }
      busy(btn, false); btn.textContent = `보냄 ✓ (${ok}명${fail ? `, 실패 ${fail}명` : ''})`; btn.disabled = true;
      toast(fail ? `${ok}명 보냄, ${fail}명 실패` : `학부모 ${ok}명에게 알림을 보냈어요`, fail ? 'err' : '');
    });
    m.addEventListener('click', e => {
      const one = e.target.closest('[data-one]'), s = e.target.closest('[data-sms]');
      if (one) { const r = B.rosterById[one.dataset.one]; m.remove(); main.querySelector(`[data-msg="${r.id}"]`)?.click(); }
      if (s) { e.preventDefault(); const r = B.rosterById[s.dataset.sms];
        if (/android|iphone|ipad/i.test(UA) || isIOS) location.href = smsHref(r.parent_phone, weeklyOf(r).msg); else { copy(weeklyOf(r).msg); toast('PC에서는 복사했어요. 폰에서 누르면 문자 앱이 열려요.'); }
        markSent(r); s.textContent = '📱 ✓'; }
    });
    m.querySelector('#cpall').onclick = () => copy(noPush.map(r => `[${r.name}${r.parent_phone ? ' ' + r.parent_phone : ''}]\n${weeklyOf(r).msg}`).join('\n\n────────\n\n'));
  });
}

/* 숙제 검사: 안 한 번호만 누르면 달성률 자동 */
async function recCheck(main, head, cls, B, dayId, k) {
  const d = B.days.find(x => x.id === dayId);
  if (!d || !d[k]) { main.innerHTML = head + `<div class="card">${empty('숙제를 찾을 수 없어요')}</div>`; return; }
  const items = REC.parseItems(d[k + '_unit'], d[k + '_items']), rk = k === 'hw1' ? 'rate' : 'hw2_rate', cut = +B.S.hw_cut || 70;
  const people = B.roster.filter(r => r.status === '재원');
  const urls = await signUrls('submissions', people.flatMap(r => { const s = B.sub(d, k, r); return s ? subFiles(s).filter(isImg).map(f => f.path) : []; }));
  let cur = null; try { cur = sessionStorage.getItem('chk|' + d.id + k); } catch (e) {}
  const done = r => { const x = B.rm[d.id + '|' + r.id]; return x && (x[k] || x[rk] != null); };
  const chip = r => { const x = B.rm[d.id + '|' + r.id] || {}, s = B.sub(d, k, r), n = s ? subFiles(s).length : 0, need = d[k + '_photos'];
    const st = done(r) ? (x[rk] != null ? `${(+x[rk]).toFixed(0)}%` : x[k]) : n ? `사진 ${n}${need ? '/' + need : ''}` : d[k + '_asg'] ? '사진 없음' : '';
    return `<button class="btn sm ${r.id === cur ? 'primary' : ''}" data-pick="${r.id}" style="${done(r) && r.id !== cur ? 'opacity:.6' : ''}">${done(r) ? '✓ ' : ''}${esc(r.name)} <span class="small" style="opacity:.75">${esc(st || '')}</span></button>`; };
  const draw = () => {
    const r = B.rosterById[cur] || people.find(p => !done(p)) || people[0]; cur = r?.id;
    try { sessionStorage.setItem('chk|' + d.id + k, cur); } catch (e) {}
    const x = B.rm[d.id + '|' + r.id] || {}, s = B.sub(d, k, r), files = s ? subFiles(s) : [], need = d[k + '_photos'];
    const miss = new Set(Array.isArray(x[k + '_missing']) ? x[k + '_missing'] : []);
    const calc = () => items.length ? (items.length - miss.size) / items.length * 100 : null;
    main.innerHTML = head + `<a class="back" href="#/t/records/${cls.id}/day/${d.id}">← ${d.day ? REC.md(d.day) + ' 수업' : '수업일'}로</a>
      <h2 style="margin:8px 0 4px">${esc(k === 'hw1' ? d.hw1_sms || d.hw1 : d.hw2)} 검사</h2>
      <p class="muted small" style="margin-top:0">${items.length ? `${esc(d[k + '_items'])} · ${items.length}${unitWord(d[k + '_unit'])}` : '검사 범위가 없어서 상태만 골라요 (수업일 설정에서 범위를 넣으면 번호 버튼이 생겨요)'}
        · 끝난 학생 ${people.filter(done).length}/${people.length}명</p>
      <div class="flex wrap" style="gap:6px;margin-bottom:14px">${people.map(chip).join('')}</div>
      <div class="card">
        <div class="flex between wrap"><h2 style="margin:0">${esc(r.name)} ${r.mode === '인강' ? '<span class="small muted">인강</span>' : ''}</h2>
          <span class="small ${files.length && need && files.length < need ? '' : 'muted'}" style="${files.length && need && files.length < need ? 'color:var(--bad);font-weight:700' : ''}">
          ${files.length ? `사진 ${files.length}${need ? '/' + need : ''}장 · ${fmtDate(s.submitted_at)}${s.edited_after_due ? ' · 마감 후 수정' : ''}` : d[k + '_asg'] ? '사진 없음 → 현장에서 봤으면 그대로 검사하세요' : '현장 검사'}</span></div>
        ${files.length ? `<div class="upl-grid" style="margin-top:10px">${files.map((f2, i) => isImg(f2) && urls[f2.path] ? `<div class="upl-item"><img src="${urls[f2.path]}" data-view="${i}" alt=""><span class="new" style="background:#0007">${i + 1}</span></div>`
          : `<div class="upl-item"><div class="upl-file" data-file="${i}">📄<span>${esc(trunc(f2.name, 14))}</span></div></div>`).join('')}</div>` : ''}
        ${items.length ? `<p class="small muted" style="margin:14px 0 6px">안 한 ${unitWord(d[k + '_unit'])}만 누르세요 (다시 누르면 취소)</p>
          <div class="flex wrap" style="gap:6px" id="its">${items.map(it => `<button type="button" class="btn sm" data-it="${esc(it)}" style="min-width:46px">${esc(it)}</button>`).join('')}</div>
          <div class="flex wrap" style="gap:6px;margin-top:8px"><button type="button" class="btn sm" id="allx">전부 안 함</button><button type="button" class="btn sm" id="clr">모두 지우기</button></div>` : ''}
        <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px" class="flex between wrap">
          <div><span class="muted small" id="cnt"></span> <b style="font-size:22px" id="pct"></b> <span id="jd"></span><div class="small" style="color:var(--bad)" id="mlist"></div></div>
          <div class="flex wrap" style="gap:6px">
            <select id="ovr" style="width:auto"><option value="">판정 자동</option>${['제출', '완벽', '미흡', '미제출', '잘못 제출', '결석'].map(o => `<option ${o === x[k] ? 'selected' : ''}>${o}</option>`).join('')}</select>
            <button class="btn primary" id="save">저장하고 다음 →</button></div></div>
      </div>`;
    const ovr = main.querySelector('#ovr');
    // 저장된 판정이 자동 계산과 같으면 '자동'으로 보이게
    if (x[k] && x[rk] != null && REC.statusFromRate(+x[rk], cut) === x[k]) ovr.value = '';
    const paint = () => {
      main.querySelectorAll('[data-it]').forEach(b => { const on = miss.has(b.dataset.it); b.style.background = on ? 'var(--bad-weak)' : ''; b.style.color = on ? 'var(--bad)' : ''; b.style.borderColor = on ? 'var(--bad)' : ''; });
      const p = calc(), st = ovr.value || REC.statusFromRate(p == null ? null : Math.round(p * 10) / 10, cut) || '제출';
      main.querySelector('#cnt').textContent = items.length ? `${items.length}${unitWord(d[k + '_unit'])} 중 ${items.length - miss.size}개 →` : '';
      main.querySelector('#pct').textContent = p == null ? '' : `${p.toFixed(1)}%`;
      main.querySelector('#jd').innerHTML = badge(st, st === '미제출' ? 'bad' : st === '미흡' || st === '잘못 제출' ? 'warn' : 'ok');
      main.querySelector('#mlist').textContent = miss.size ? '안 한 것: ' + items.filter(i => miss.has(i)).join(', ') : '';
    };
    paint();
    main.querySelector('#its')?.addEventListener('click', e => { const b = e.target.closest('[data-it]'); if (!b) return; miss.has(b.dataset.it) ? miss.delete(b.dataset.it) : miss.add(b.dataset.it); paint(); });
    main.querySelector('#allx')?.addEventListener('click', () => { items.forEach(i => miss.add(i)); paint(); });
    main.querySelector('#clr')?.addEventListener('click', () => { miss.clear(); paint(); });
    ovr.onchange = paint;
    main.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { cur = b.dataset.pick; draw(); });
    const imgs = files.filter(f2 => isImg(f2) && urls[f2.path]);
    main.querySelectorAll('[data-view]').forEach(im => im.onclick = () => lightbox(imgs.map(f2 => ({ url: urls[f2.path], name: f2.name })), imgs.indexOf(files[+im.dataset.view])));
    main.querySelectorAll('[data-file]').forEach(el => el.onclick = () => openFile('submissions', files[+el.dataset.file].path));
    main.querySelector('#save').onclick = async e => {
      const btn = e.currentTarget; busy(btn, true);
      const p = calc(), rate = p == null ? null : Math.round(p * 10) / 10;
      const o = { [k]: ovr.value || REC.statusFromRate(rate, cut) || '제출', [rk]: rate, [k + '_missing']: items.length ? items.filter(i => miss.has(i)) : null, updated_at: new Date().toISOString() };
      try {
        const old = B.rm[d.id + '|' + r.id];
        B.rm[d.id + '|' + r.id] = old ? await q(sb.from('class_records').update(o).eq('id', old.id).select().single())
          : await q(sb.from('class_records').insert({ day_id: d.id, roster_id: r.id, ...o }).select().single());
        toast(`${r.name} ${o[k]}${rate != null ? ` (${rate}%)` : ''} 저장`);
        const idx = people.indexOf(r), next = people.slice(idx + 1).find(p2 => !done(p2)) || people.find(p2 => !done(p2));
        if (next) { cur = next.id; draw(); window.scrollTo(0, 0); } else { toast('모든 학생 검사 끝! 🎉'); location.hash = `/t/records/${cls.id}/day/${d.id}`; }
      } catch (err) { busy(btn, false); }
    };
  };
  draw();
}

function recBlack(main, head, cls, B) {
  const today = todayISO();
  const groups = B.roster.filter(r => r.status === '재원').map(r => ({ r, items: REC.open(B.days, B.recOf(r.id), B.S, today) })).filter(g => g.items.length)
    .sort((a, b) => b.items.length - a.items.length);
  const total = groups.reduce((n, g) => n + g.items.length, 0);
  main.innerHTML = head + recTabs(cls.id, 'black') + `
    <div class="grid stats">${stat(total, '남은 항목')}${stat(groups.length, '해당 학생')}${stat(groups.filter(g => g.items.length >= 2).length, '2개 이상')}</div>
    <div class="card">${groups.length ? groups.map(g => `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div class="flex between wrap"><b>${esc(g.r.name)} ${badge(g.items.length + '개', g.items.length >= 2 ? 'bad' : 'warn')}</b>
          <button class="btn sm" data-remind="${g.r.id}">학생에게 알림</button></div>
        ${g.items.map(it => `<div class="flex between" style="margin-top:6px;gap:8px"><span class="small"><span class="muted">${REC.md(it.day.day)}</span> ${esc(it.todo)} <span class="muted">(${esc(it.short)})</span></span>
          <button class="btn sm primary" data-fix="${it.day.id}|${g.r.id}|${it.key}">해결</button></div>`).join('')}</div>`).join('')
      : empty('남은 항목이 없어요! 🎉')}</div>`;
  main.addEventListener('click', async e => {
    const b = e.target.closest('[data-fix]');
    if (b) {
      const [dayId, rid, k] = b.dataset.fix.split('|'), rec = B.rm[dayId + '|' + rid];
      const dt = prompt(k.startsWith('t') ? '통과한 날짜 (재시험·응시 후 통과)' : '해결한 날짜 (제출·보완 완료)', today);
      if (!dt) return;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return toast('날짜는 2026-11-14 처럼 적어 주세요', 'err');
      await q(sb.from('class_records').update({ [k + '_done']: dt, updated_at: new Date().toISOString() }).eq('id', rec.id)); toast('해결 처리했어요'); route();
    }
    const rm = e.target.closest('[data-remind]');
    if (rm) {
      const g = groups.find(x => x.r.id === rm.dataset.remind);
      if (!g.r.profile_id) return toast('이 학생은 아직 앱에 가입하지 않았어요', 'err');
      const p = await q(sb.from('profiles').select('id,full_name,phone,class_id').eq('id', g.r.profile_id).single());
      sendPushModal([p], { title: '아직 안 끝난 항목이 있어요', body: g.items.map(i => `${REC.md(i.day.day)} ${i.todo}`).join(', '), url: './' });
    }
  });
}

function recMonth(main, head, cls, B, ym) {
  const months = [...new Set(B.days.filter(d => d.day).map(d => d.day.slice(0, 7)))].sort().reverse();
  if (!ym || !months.includes(ym)) ym = months.includes(todayISO().slice(0, 7)) ? todayISO().slice(0, 7) : months[0];
  if (!ym) { main.innerHTML = head + recTabs(cls.id, 'month') + `<div class="card">${empty('아직 수업일이 없어요')}</div>`; return; }
  const ORD = { '집중 확인': 0, '주의': 1, '양호': 2 };
  const rows = B.roster.filter(r => r.status === '재원').map(r => ({ r, s: REC.monthly(r, B.days, B.recOf(r.id), B.S, ym, todayISO()) })).filter(x => x.s.n)
    .sort((a, b) => ORD[a.s.status] - ORD[b.s.status] || a.r.name.localeCompare(b.r.name));
  const cnt = k => rows.filter(x => x.s.status === k).length;
  main.innerHTML = head + recTabs(cls.id, 'month') + `
    <div class="flex wrap" style="gap:6px;margin-bottom:12px">${months.map(m => `<a class="btn sm ${m === ym ? 'primary' : ''}" href="#/t/records/${cls.id}/month/${m}">${+m.slice(5)}월</a>`).join('')}</div>
    <div class="grid stats">${stat(cnt('집중 확인'), '집중 확인')}${stat(cnt('주의'), '주의')}${stat(cnt('양호'), '양호')}</div>
    <div class="card tbl-wrap">${rows.length ? `<table><thead><tr><th>이름</th><th>상태</th><th>숙제 평균</th><th>미제출</th><th>미흡</th><th>통과</th><th>불통과</th><th>미응시</th><th>남은 항목</th><th></th></tr></thead><tbody>
      ${rows.map(({ r, s }) => `<tr><td><b>${esc(r.name)}</b></td><td>${badge(s.status, s.status === '집중 확인' ? 'bad' : s.status === '주의' ? 'warn' : 'ok')}</td>
        <td>${s.avg == null ? '-' : s.avg.toFixed(1) + '%'}</td><td>${s.miss || ''}</td><td>${s.poor || ''}</td><td>${s.pass || ''}</td><td>${s.fail || ''}</td><td>${s.absent || ''}</td><td>${s.left || ''}</td>
        <td><button class="btn sm" data-m="${r.id}">월간 문자</button></td></tr>`).join('')}</tbody></table>` : empty('이 달 기록이 없어요')}
      <p class="muted small" style="margin-bottom:0">집중 확인: 남은 항목 2개↑ 또는 불통과+미응시 3회↑ 또는 미제출 2회↑ · 주의: 남은 항목 1개 또는 숙제 평균 ${esc(B.S.hw_cut || 70)}% 미만</p></div>`;
  let parentsP = null;
  main.addEventListener('click', async e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    const x = rows.find(y => y.r.id === b.dataset.m), parents = (await (parentsP ||= loadParentsByRoster(B.roster)))[x.r.id] || [];
    messageModal(x.r, x.s.msg, { title: `${+ym.slice(5)}월 월간 문자`, parents, pushTitle: `${x.r.name} 학생 ${+ym.slice(5)}월 학습 현황`, pushBody: `숙제 평균 ${x.s.avg == null ? '-' : x.s.avg.toFixed(1) + '%'} · 통과 ${x.s.pass}회 / 불통과 ${x.s.fail}회 (눌러서 자세히 보기)` });
  });
}

async function recRoster(main, head, cls, B) {
  const studs = await q(sb.from('profiles').select('id,full_name,class_id,status').eq('role', 'student').order('full_name'));
  const linked = new Set(B.roster.map(r => r.profile_id).filter(Boolean)), byId = Object.fromEntries(studs.map(s => [s.id, s]));
  const free = studs.filter(s => !linked.has(s.id) && (s.class_id === cls.id || !s.class_id));
  const sel = (k, v, opts) => `<select data-k="${k}">${opts.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  main.innerHTML = head + recTabs(cls.id, 'roster') + `
    <div class="card"><p class="small" style="margin:0">학생이 앱에 가입할 때 반 코드 <span class="code" style="font-size:14px">${esc(cls.join_code)}</span> 를 넣고 <b>명단과 똑같은 이름</b>을 쓰면 자동으로 연결되고 승인까지 돼요.
      학부모님은 자녀 연결 코드로 가입하면서 <b>명단의 학부모 번호</b>를 쓰면 자동 승인돼요.</p></div>
    <div class="card tbl-wrap"><table><thead><tr><th>이름</th><th>상태</th><th>수강</th><th>학부모 연락처</th><th>문자</th><th>앱 계정</th><th>메모</th><th></th></tr></thead><tbody>
      ${B.roster.map(r => `<tr data-r="${r.id}"><td><input data-k="name" value="${esc(r.name)}" style="width:90px"></td>
        <td>${sel('status', r.status, ['재원', '휴원', '퇴원'])}</td><td>${sel('mode', r.mode, ['현장', '인강'])}</td>
        <td><input data-k="parent_phone" value="${esc(r.parent_phone || '')}" placeholder="010-0000-0000" style="width:130px"></td>
        <td><input type="checkbox" data-k="sms" ${r.sms !== false ? 'checked' : ''}></td>
        <td>${r.profile_id ? `${badge('연결됨', 'ok')} <span class="small">${esc(byId[r.profile_id]?.full_name || '')}</span> <button class="btn sm" data-unlink="${r.id}">끊기</button>`
          : `<select data-link="${r.id}"><option value="">미가입</option>${free.map(s => `<option value="${s.id}">${esc(s.full_name)}${s.status !== 'approved' ? ' (대기)' : ''}</option>`).join('')}</select>`}</td>
        <td><input data-k="memo" value="${esc(r.memo || '')}" style="width:200px"></td>
        <td>${isHead() ? `<button class="btn sm danger" data-del="${r.id}">삭제</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h2>학생 추가</h2><form id="af" class="flex wrap" style="align-items:flex-end">
      <label style="margin:0">이름<input name="name" required style="width:110px"></label>
      <label style="margin:0">수강<select name="mode"><option>현장</option><option>인강</option></select></label>
      <label style="margin:0">학부모 연락처<input name="parent_phone" placeholder="010-0000-0000"></label>
      <button class="btn primary">추가</button></form></div>`;
  main.querySelector('tbody').addEventListener('change', async e => {
    const tr = e.target.closest('tr[data-r]'), el = e.target;
    if (el.dataset.link !== undefined) {
      if (!el.value) return;
      await q(sb.from('roster').update({ profile_id: el.value }).eq('id', el.dataset.link));
      const s = byId[el.value]; if (s && (s.status !== 'approved' || s.class_id !== cls.id)) await q(sb.from('profiles').update({ status: 'approved', class_id: cls.id }).eq('id', s.id));
      toast('연결했어요'); return route();
    }
    if (!el.dataset.k) return;
    const val = el.type === 'checkbox' ? el.checked : el.value.trim() || null;
    if (el.dataset.k === 'name' && !val) return toast('이름은 비울 수 없어요', 'err');
    await q(sb.from('roster').update({ [el.dataset.k]: val }).eq('id', tr.dataset.r));
    tr.style.background = '#f0faf4'; setTimeout(() => tr.style.background = '', 600);
  });
  main.addEventListener('click', async e => {
    const u = e.target.closest('[data-unlink]'), dl = e.target.closest('[data-del]');
    if (u && confirm('앱 계정 연결을 끊을까요? (기록은 그대로 있어요)')) { await q(sb.from('roster').update({ profile_id: null }).eq('id', u.dataset.unlink)); route(); }
    if (dl) { const r = B.roster.find(x => x.id === dl.dataset.del);
      if (confirm(`${r.name} 학생을 명단에서 지울까요?\n이 학생의 수업 기록도 모두 지워져요. 그만둔 학생이면 '퇴원'으로 바꾸는 걸 추천해요.`)) { await q(sb.from('roster').delete().eq('id', r.id)); toast('삭제했어요'); route(); } }
  });
  const f = main.querySelector('#af');
  f.onsubmit = async e => {
    e.preventDefault();
    await q(sb.from('roster').insert({ class_id: cls.id, name: f.name.value.trim(), mode: f.mode.value, parent_phone: f.parent_phone.value.trim() || null, sort: B.roster.length }));
    toast('추가했어요'); route();
  };
}

/* 학생·학부모 화면: 수업 기록 카드 */
async function myBookCard(profileId, who) {
  const ro = await q(sb.from('roster').select('*').eq('profile_id', profileId));
  if (!ro.length) return '';
  const r = ro[0];
  const [days, S] = await Promise.all([q(sb.from('class_days').select('*').eq('class_id', r.class_id).order('day')), loadSettings()]);
  const recs = await q(sb.from('class_records').select('*').eq('roster_id', r.id));
  const asgIds = days.flatMap(d => [d.hw1_asg, d.hw2_asg]).filter(Boolean);
  const subs = asgIds.length ? await q(sb.from('submissions').select('assignment_id,files,file_path,file_name').eq('user_id', profileId).in('assignment_id', asgIds)).catch(() => []) : [];
  const subOf = d => k => subs.find(x => x.assignment_id === d[k + '_asg']) || null;
  const rm = Object.fromEntries(recs.map(x => [x.day_id, x])), recOf = d => effRec(d, rm[d.id], subOf(d));
  const open = REC.open(days, recOf, S, todayISO());
  const done = days.filter(d => d.day && recOf(d)).sort((a, b) => b.day.localeCompare(a.day));
  const last = done[0];
  const lastItems = last ? REC.items(last, recOf(last), S) : [];
  const lines = its => its.map(x => `<div class="flex between" style="padding:7px 0;border-bottom:1px solid var(--line);gap:8px"><span>${esc(x.kind === 'hw' ? '숙제 · ' + x.name : x.name + ' 테스트')}</span>
    ${badge(esc(x.short) + (x.bad && x.done ? ' → 완료' : ''), x.bad && x.done ? 'ok' : J_CLS[x.j] || '')}</div>`).join('');
  return `<div class="card"><h2>${who === 'parent' ? '수업 기록' : '내 수업 기록'}</h2>
    ${open.length ? `<div style="background:var(--bad-weak);border-radius:10px;padding:10px 14px;margin-bottom:12px"><b style="color:var(--bad)">아직 안 끝난 것 ${open.length}개</b>
      ${open.map(it => `<div class="small" style="margin-top:4px">${REC.md(it.day.day)} · ${esc(it.todo)}</div>`).join('')}</div>`
      : `<p class="small" style="color:var(--ok);font-weight:700;margin-top:0">밀린 숙제·재시험 없음 👍</p>`}
    ${last ? `<div class="small muted" style="margin-bottom:2px">${REC.md(last.day)} 수업 결과</div>${lines(lastItems)}` : ''}
    ${done.length > 1 ? `<details style="margin-top:10px"><summary class="small" style="font-weight:700">지난 수업 결과 보기</summary>
      ${done.slice(1).map(d => `<div class="small muted" style="margin-top:10px">${REC.md(d.day)}</div>${lines(REC.items(d, recOf(d), S))}`).join('')}</details>` : ''}
    ${last?.notice ? `<details style="margin-top:10px"><summary class="small" style="font-weight:700">선생님 안내</summary><p class="small" style="white-space:pre-wrap">${esc(last.notice)}</p></details>` : ''}</div>`;
}

boot();
